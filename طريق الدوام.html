<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>طريق الدوام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&display=swap">
<style>
/* Concept: a commute at dawn. UI is built from Saudi road signs: green boards with a white inner line for info and shop items, a yellow plate for the clock and prices. The scene is a hilly road with palms and lamp posts, the office at the end. Single look by choice (a game scene), every colour is a token. */
:root {
  --asphalt: #1c2024;
  --asphalt-2: #272c31;
  --sign: #0b6e4f;
  --sign-deep: #08543c;
  --sign-ink: #ffffff;
  --plate: #ffc72c;
  --plate-ink: #1a1a14;
  --paper: #eef2ef;
  --muted: #a9b6b0;
  --danger: #e5484d;
  --office: #2d5b8a;
  --display: 'Lalezar', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --body: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--asphalt); color: var(--sign-ink); font: 500 15px/1.5 var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--plate); outline-offset: 2px; }
#app { height: 100%; max-width: 1000px; margin-inline: auto; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--asphalt); }

/* HUD */
.hud { padding: 10px 16px 8px; display: grid; gap: 8px; }
.row1 { display: flex; align-items: center; gap: 10px; }
.sign { background: var(--sign); border: 2px solid var(--sign-ink); border-radius: 8px; box-shadow: 0 0 0 2px var(--sign); padding: 2px 12px; display: flex; align-items: baseline; gap: 6px; }
.bal { min-width: 0; }
.bal .lbl { font-size: 12px; opacity: .85; }
.bal b { font: 400 28px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.bal .unit { font: 400 18px var(--display); }
.plate { margin-inline-start: auto; background: var(--plate); color: var(--plate-ink); border-radius: 6px; padding: 2px 12px; font: 700 20px/1.3 var(--body); font-variant-numeric: tabular-nums; letter-spacing: .02em; border: 2px solid #1a1a14; }
.plate.late { background: var(--danger); color: #fff; }
.day { font-size: 13px; color: var(--muted); white-space: nowrap; }
.day b { color: var(--sign-ink); font-size: 16px; }
.iconbtn { width: 38px; height: 38px; border-radius: 8px; border: 2px solid #3a4148; background: var(--asphalt-2); display: grid; place-items: center; padding: 0; }
.iconbtn svg { width: 18px; height: 18px; fill: var(--sign-ink); }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: center; }
.track { display: flex; align-items: center; gap: 8px; min-width: 0; }
.track svg { width: 22px; height: 22px; flex: none; }
.rail { position: relative; flex: 1; height: 8px; background: #3a4148; border-radius: 4px; }
.rail i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--plate); border-radius: 4px; }
.rail u { position: absolute; top: 50%; left: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; border: 3px solid var(--sign); text-decoration: none; }
.left { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stam { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; color: var(--muted); }
.bar { flex: 1; height: 10px; background: #3a4148; border-radius: 5px; overflow: hidden; min-width: 40px; }
.bar i { display: block; height: 100%; width: 100%; background: #5ed38a; transition: background .2s; }
.stam.tired .bar i { background: var(--danger); }
.stam em { font-style: normal; color: var(--sign-ink); white-space: nowrap; }

/* stage */
#stage { position: relative; min-height: 0; background: #7eb6d6; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sheet { position: absolute; inset: 0; overflow-y: auto; padding: 16px; background: var(--asphalt); display: flex; flex-direction: column; gap: 16px; }
.sheet[hidden] { display: none; }
.sheet h2 { margin: 0; font: 400 26px/1.2 var(--display); text-wrap: balance; }
.mission { display: grid; gap: 4px; color: var(--muted); font-size: 14px; }
.mission b { color: var(--sign-ink); font-variant-numeric: tabular-nums; }
.how { background: var(--asphalt-2); border: 2px dashed var(--plate); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; font-size: 14px; }
.how b { color: var(--plate); }
.merchant { display: flex; gap: 12px; align-items: center; }
.merchant svg { width: 64px; height: 64px; flex: none; }
.say { background: var(--paper); color: #17201b; border-radius: 12px 12px 12px 2px; padding: 10px 14px; font-size: 14px; position: relative; }
.shopgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.shopgrid h3 { grid-column: 1 / -1; margin: 6px 0 0; font: 400 20px var(--display); color: var(--plate); }
.item { background: var(--sign); border: 3px solid var(--sign-ink); border-radius: 10px; outline: 2px solid var(--sign); padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.item .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.item b { font: 400 20px/1.2 var(--display); }
.item p { margin: 0; font-size: 13px; opacity: .92; }
.pips { display: flex; gap: 4px; }
.pips i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--sign-ink); }
.pips i.on { background: var(--plate); border-color: var(--plate); }
.buy { align-self: end; justify-self: start; background: var(--plate); color: var(--plate-ink); border: 2px solid #1a1a14; border-radius: 6px; padding: 4px 14px; font: 700 15px var(--body); font-variant-numeric: tabular-nums; }
.buy:disabled { background: #6f7a74; color: #20262a; border-color: #20262a; cursor: not-allowed; }
.buy.use { background: var(--paper); }
.buy.on { background: transparent; color: var(--sign-ink); border-color: var(--sign-ink); cursor: default; }
.reset { align-self: flex-start; background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: 13px; }
.endcard { margin: auto; width: min(420px, 100%); background: var(--sign); border: 3px solid var(--sign-ink); outline: 2px solid var(--sign); border-radius: 12px; padding: 18px; display: grid; gap: 10px; }
.endcard.bad { background: #8d2a2e; outline-color: #8d2a2e; }
.endcard h2 { font-size: 30px; }
.endcard .ln { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.endcard .tot { border-top: 2px solid rgba(255,255,255,.5); padding-top: 8px; font: 400 24px var(--display); }
#pause { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20,24,28,.62); font: 400 34px var(--display); }
#pause[hidden] { display: none; }

/* controls */
.ctl { padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; justify-items: center; background: var(--asphalt); }
#go { width: min(100%, 460px); height: 64px; border-radius: 14px; border: 3px solid #1a1a14; background: var(--plate); color: var(--plate-ink); font: 400 28px var(--display); touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 5px 0 #b88d00; transition: transform .05s, box-shadow .05s; }
#go.down { transform: translateY(4px); box-shadow: 0 1px 0 #b88d00; }
#go.run { background: #ff8a3d; box-shadow: 0 5px 0 #b95a14; }
#go.run.down { box-shadow: 0 1px 0 #b95a14; }
.keys { font-size: 12px; color: var(--muted); }
@media (hover: none) { .keys { display: none; } }
@media (max-width: 460px) { .row2 { grid-template-columns: 1fr; gap: 6px; } .bal b { font-size: 24px; } }
@media (prefers-reduced-motion: reduce) { #go { transition: none; } }
</style>

<div id="app">
  <header class="hud">
    <div class="row1">
      <div class="sign bal"><span class="lbl">رصيدك</span><b id="bal">0</b><span class="unit">م</span></div>
      <div class="day">يوم <b id="day">1</b></div>
      <div class="plate" id="clock">6:00 ص</div>
      <button class="iconbtn" id="pausebtn" aria-label="إيقاف مؤقت"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg></button>
    </div>
    <div class="row2">
      <div class="track" dir="ltr">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 12 4l9 8v8h-6v-5H9v5H3z" fill="#ffffff"/></svg>
        <div class="rail"><i id="prog"></i><u id="dot"></u></div>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1" fill="#7fb2e5"/><g fill="#14304d"><rect x="8" y="6" width="3" height="3"/><rect x="13" y="6" width="3" height="3"/><rect x="8" y="11" width="3" height="3"/><rect x="13" y="11" width="3" height="3"/><rect x="10.5" y="16" width="3" height="5"/></g></svg>
        <span class="left" id="left">500 م</span>
      </div>
      <div class="stam" id="stamwrap"><span>البنزين</span><div class="bar"><i id="stam"></i></div><em id="vehname">سيارتك القديمة</em></div>
    </div>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <section class="sheet" id="home"></section>
    <section class="sheet" id="end" hidden></section>
    <div id="pause" hidden>موقّف. اضغط للمتابعة</div>
  </main>

  <footer class="ctl">
    <button id="go" type="button">اطلع للشغل</button>
    <div class="keys" id="keys">من الكيبورد: مسطرة (Space) أو السهم الأيمن للبنزين، وP للإيقاف</div>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var fmt = function (n) { return Math.round(n).toLocaleString('en-US'); };
  function rng(seed) { var a = seed >>> 0; return function () { a += 0x6D2B79F5; var t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hs(n) { n = Math.imul(n ^ 61, 0x45d9f3b); n ^= n >>> 16; n = Math.imul(n, 0x45d9f3b); n ^= n >>> 16; return (n >>> 0) / 4294967296; }
  function mix(c1, c2, t) { return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(lerp(c1[i], c2[i], t)); }).join(',') + ')'; }

  /* ---------- game data ---------- */
  var UPG = [
    { id: 'shoes', name: 'محرك أقوى', desc: 'السيارة أسرع بنسبة 12% لكل مستوى', base: 200, grow: 1.8 },
    { id: 'thermos', name: 'خزان أكبر', desc: '+20 بنزين، تمشي مسافة أطول قبل ما يخلص', base: 150, grow: 1.7 },
    { id: 'alarm', name: 'منبّه ثاني', desc: '+8 ثواني قبل ما يفوتك الدوام', base: 250, grow: 1.8 },
    { id: 'bag', name: 'بونص الراتب', desc: 'كل متر تقطعه يحسب لك 15% زيادة', base: 300, grow: 1.9 },
    { id: 'gym', name: 'كفرات جبلية', desc: 'الطلعات تبطّئك أقل، وتصرف بنزين أقل فيها', base: 220, grow: 1.8 }
  ];
  var MAXLV = 5;
  var VEH = [
    { name: 'سيارتك القديمة', run: 17, cost: 0, drain: 1, desc: 'ماشية الحال، بس تدور.' },
    { name: 'سيدان', run: 22, cost: 3000, drain: .85, desc: 'مريحة وأسرع، وتصرف بنزين أقل.' },
    { name: 'دفع رباعي', run: 25, cost: 9000, drain: .65, desc: 'عالية وقوية، والطلعات ما تهمها.' },
    { name: 'سيارة سبورت', run: 36, cost: 30000, drain: .5, desc: 'أخيراً! تطير على النزلات.' }
  ];
  var SAYS = [
    'يا هلا بالموظف! الطريق طويل، وكل متر تقطعه له سعر عندي.',
    'ما فيه شي ببلاش يا غالي، بس عندي بضاعة تستاهل.',
    'اللي يوصل بدري يقبض أكثر. شوف وش يناسبك.',
    'المحرك هذا جرّبته أنا بنفسي، والله ما شفت أقوى منه.',
    'المدير ما يسامح على التأخير، خلّك جاهز.',
    'الطلعات هالأيام وايد، لا تنسى الكفرات.'
  ];
  var SAVE_KEY = 'dawam.v2';
  var S = load() || fresh();
  function fresh() { return { money: 0, day: 1, up: { shoes: 0, thermos: 0, alarm: 0, bag: 0, gym: 0 }, veh: 0, owned: [0], best: 0 }; }
  function load() {
    try {
      var j = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (j && typeof j.money === 'number' && typeof j.day === 'number' && j.up && Array.isArray(j.owned)) {
        var f = fresh(); Object.keys(f.up).forEach(function (k) { f.up[k] = clamp(+j.up[k] || 0, 0, MAXLV); });
        f.money = Math.max(0, j.money); f.day = Math.max(1, j.day); f.owned = j.owned.filter(function (i) { return VEH[i]; }); if (f.owned.indexOf(0) < 0) f.owned.push(0);
        f.veh = f.owned.indexOf(j.veh) >= 0 ? j.veh : 0; f.best = +j.best || 0; return f;
      }
    } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

  function price(u, lv) { return Math.round(u.base * Math.pow(u.grow, lv) / 10) * 10; }
  function distOf(day) { return 500 + 150 * (day - 1); }
  function maxSt() { return 100 + 20 * S.up.thermos; }
  function limitOf(day) { return distOf(day) / 9.5 + 12 + 8 * S.up.alarm; }
  function mult() { return 1 + .15 * S.up.bag; }

  /* ---------- run state ---------- */
  var mode = 'home', R = null, last = 0;
  function makeRun() {
    var dist = distOf(S.day), r = rng(S.day * 7919 + 13), c = rng(S.day * 31 + 5);
    var run = {
      x: 0, v: 0, st: maxSt(), tired: false, t: 0, earn: 0, hold: false, paused: false, dist: dist, limit: limitOf(S.day),
      terr: { A: 26 + .6 * Math.min(S.day, 12), p1: r() * 6.28, p2: r() * 6.28, p3: r() * 6.28, f1: 6.283 / (300 + r() * 110), f2: 6.283 / (140 + r() * 50), f3: 6.283 / (80 + r() * 20) },
      cups: [], phase: 0, floats: [], camH: 0, view: 0
    };
    var x = 80; while (x < dist - 60) { run.cups.push({ x: x, got: false }); x += 80 + c() * 120; }
    return run;
  }
  function hAt(x) {
    var T = R.terr, w = Math.min(1, Math.max(0, x) / 90) * Math.min(1, Math.max(0, R.dist - x) / 90);
    if (x < 0 || x > R.dist) return 0;
    w = w * w * (3 - 2 * w);
    return w * T.A * (Math.sin(T.f1 * x + T.p1) + .4 * Math.sin(T.f2 * x + T.p2) + .15 * Math.sin(T.f3 * x + T.p3));
  }
  function slopeAt(x) { return (hAt(x + .6) - hAt(x - .6)) / 1.2; }

  function step(dt) {
    var veh = VEH[S.veh], slope = slopeAt(R.x), sp = 1 + .12 * S.up.shoes, gym = 1 - .12 * S.up.gym;
    var gas = R.hold && R.st > 0, top = veh.run * sp;
    var acc = gas ? (top - R.v) * 1.8 : -R.v * .9;
    acc -= slope > 0 ? slope * 9 * gym : slope * 9;
    R.v = Math.max(0, R.v + acc * dt);
    var dx = R.v * dt; R.x += dx; R.earn += dx * mult(); R.t += dt;
    if (gas) {
      R.st -= 2 * veh.drain * (1 + Math.max(0, slope) * 1.5 * gym) * dt;
      if (R.st <= 0) { R.st = 0; if (!R.dry) { R.dry = true; addFloat('البنزين خلص!'); } }
    }
    R.tired = R.st <= 0;
    R.cups.forEach(function (c) { if (!c.got && Math.abs(c.x - R.x) < 3) { c.got = true; R.st = Math.min(maxSt(), R.st + 25); R.dry = false; addFloat('+25 بنزين'); } });
    R.floats.forEach(function (f2) { f2.life -= dt; }); R.floats = R.floats.filter(function (f2) { return f2.life > 0; });
    if (R.x >= R.dist - 1) finish(true); else if (R.t >= R.limit) finish(false);
  }
  function addFloat(text) { R.floats.push({ text: text, life: 1.2, max: 1.2 }); }

  function finish(ok) {
    mode = 'end'; R.hold = false;
    var earn = Math.floor(R.earn), arr = 0, tb = 0;
    if (ok) { arr = Math.round(R.dist * .25 * mult()); tb = Math.round(Math.max(0, R.limit - R.t) * 4); S.day++; S.best = Math.max(S.best, S.day - 1); }
    var tot = earn + arr + tb; S.money += tot; save();
    var el = $('end');
    el.innerHTML = '<div class="endcard' + (ok ? '' : ' bad') + '"><h2>' + (ok ? 'وصلت الشغل بدري!' : 'تأخرت على الدوام!') + '</h2>' +
      '<div>' + (ok ? 'المدير ابتسم لك اليوم، وهذا حسابك:' : 'المدير يتصل عليك. ما وصلت، لكن اللي مشيته يحسب لك:') + '</div>' +
      '<div class="ln"><span>أمتار الطريق</span><b>' + fmt(earn) + ' م</b></div>' +
      (ok ? '<div class="ln"><span>مكافأة الوصول</span><b>' + fmt(arr) + ' م</b></div><div class="ln"><span>مكافأة الوقت الباقي</span><b>' + fmt(tb) + ' م</b></div>' : '') +
      '<div class="ln tot"><span>المجموع</span><span>+' + fmt(tot) + ' م</span></div></div>';
    el.hidden = false; $('home').hidden = true; refresh();
  }

  /* ---------- screens ---------- */
  var merchantSVG = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#08543c"/><path d="M10 64c0-16 10-22 22-22s22 6 22 22z" fill="#ffffff"/><path d="M32 42v22" stroke="#d9dfdb" stroke-width="2"/><circle cx="32" cy="29" r="11" fill="#c98f63"/><path d="M18 30c0-12 6-18 14-18s14 6 14 18c-3-5-6-7-14-7s-11 2-14 7z" fill="#ffffff"/><path d="M18 30c0-12 6-18 14-18s14 6 14 18" fill="none" stroke="#c9302c" stroke-width="2" stroke-dasharray="3 2"/><path d="M26 33q6 5 12 0" fill="none" stroke="#3a2a1c" stroke-width="2"/><circle cx="27.5" cy="28" r="1.4" fill="#2a1c12"/><circle cx="36.5" cy="28" r="1.4" fill="#2a1c12"/></svg>';
  function pips(n) { var h = ''; for (var i = 0; i < MAXLV; i++) h += '<i class="' + (i < n ? 'on' : '') + '"></i>'; return '<span class="pips" aria-label="المستوى ' + n + ' من ' + MAXLV + '">' + h + '</span>'; }
  function renderHome() {
    var d = distOf(S.day), lim = limitOf(S.day), h = '';
    h += '<h2>يوم ' + S.day + '، لازم توصل الشغل</h2>';
    h += '<div class="mission"><span>المسافة من بيتك للشغل: <b>' + fmt(d) + ' م</b></span><span>الدوام الساعة 8:00 ص، وعندك <b>' + Math.round(lim) + ' ثانية</b> من أول الطريق</span></div>';
    if (S.day === 1 && S.best === 0) h += '<div class="how"><b>كيف تلعب؟</b><span>اضغط على الزر الكبير <b>وأنت ماسكه</b> عشان السيارة تمشي، وإذا فكيته توقف وتبطّئ لين تقف. السيارة ما تمشي من نفسها.</span><span>الطلعة تبطّئك وتصرف بنزين أكثر، والنزلة تسرّعك. جوالين البنزين الحمراء على الطريق تعبّي لك الخزان.</span><span>كل متر تقطعه = فلوس. اشتر تطويرات من التاجر وتصير أسرع.</span></div>';
    h += '<div class="merchant">' + merchantSVG + '<div class="say">' + SAYS[(S.day + S.best) % SAYS.length] + '</div></div>';
    h += '<div class="shopgrid"><h3>تطويرات</h3>';
    UPG.forEach(function (u) {
      var lv = S.up[u.id], max = lv >= MAXLV, p = price(u, lv);
      h += '<div class="item"><div class="top"><b>' + u.name + '</b>' + pips(lv) + '</div><p>' + u.desc + '</p>' +
        (max ? '<button class="buy on" disabled>أقصى مستوى</button>' : '<button class="buy" data-up="' + u.id + '"' + (S.money < p ? ' disabled' : '') + '>اشتر · ' + fmt(p) + ' م</button>') + '</div>';
