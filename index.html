<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة القرارات الواقعية</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .game-card {
            width: 750px;
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .status-bar {
            display: flex;
            justify-content: space-around;
            background: #21262d;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #30363d;
        }
        .story-box {
            background: #0d1117;
            padding: 25px;
            border-radius: 10px;
            min-height: 110px;
            font-size: 18px;
            line-height: 1.6;
            border: 1px solid #30363d;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            text-align: right;
        }
        button:hover {
            background: #2ea043;
        }
        button.secondary {
            background: #1f6feb;
        }
        button.secondary:hover {
            background: #388bfd;
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- مؤشرات الحالة (المزاج والطاقة) -->
    <div class="status-bar">
        <span>🧠 المزاج العام: <strong id="mood">80</strong>%</span>
        <span>⚡ الطاقة: <strong id="energy">90</strong>%</span>
    </div>
    
    <!-- صندوق القصة والشخصية -->
    <div class="story-box" id="storyText">
        جارِ تحميل القصة...
    </div>
    
    <!-- الأزرار والخيارات -->
    <div class="choices" id="choicesBox">
        <!-- تتعبأ تلقائياً بالبرمجة -->
    </div>
</div>

<script>
    let stats = {
        mood: 80,
        energy: 90
    };

    // سيناريوهات اللعبة الواقعية الهادئة
    const scenes = [
        {
            text: "رجعت البيت متأخر والدوام كرفك كرف، والمدام جهزت العشاء بس زعلانة شوي ليش تأخرت. وش بتسوي؟",
            choices: [
                { text: "تعتذر منها وتجلس تسولف معها وتتعشى بهدوء.", mood: +15, energy: -10, next: 1 },
                { text: "تقول لها أنا تعبان وتدخل تنام فوراً بدون كلام.", mood: -20, energy: +20, next: 2 }
            ]
        },
        {
            ,
            text: "الصباح بدري، جوالك يدق مزعج وأنت وراك مشوار مهم لإصلاح مكيف الصالة الحار. كيف تبدأ يومك؟",
            choices: [
                { text: "تقوم بنشاط وتصلح المكيف عشان تروق البيت.", mood: +10, energy: -20, next: 2 },
                { text: "تطنيش وترجع تغطي وجهك وتكمل نومك.", mood: -10, energy: +15, next: 0 }
            ]
        },
        {
            text: "الجو رايق بالليل وقررت تفتح طاقة الفلل شوي وتجلس مع نفسك تضبط امورك وتخطط للأسبوع.",
            choices: [
                { text: "تقعد تفكر بهدوء وتشرب قهوة مضبوطة.", mood: +20, energy: -5, next: 0 },
                { text: "تشغل إكس بوكس وتغير جو شوي تفصل عن التفكير.", mood: +25, energy: -15, next: 1 }
            ]
        }
    ];

    let currentScene = 0;

    function updateGame() {
        // حماية الحدود عشان ما تصفّر الأرقام مرة
        if (stats.mood > 100) stats.mood = 100;
        if (stats.mood < 0) stats.mood = 0;
        if (stats.energy > 100) stats.energy = 100;
        if (stats.energy < 0) stats.energy = 0;

        document.getElementById('mood').innerText = stats.mood;
        document.getElementById('energy').innerText = stats.energy;

        const scene = scenes[currentScene];
        document.getElementById('storyText').innerText = scene.text;

        const choicesBox = document.getElementById('choicesBox');
        choicesBox.innerHTML = '';

        scene.choices.forEach((choice, index) => {
            const btn = document.createElement('button');
            btn.innerText = `• ${choice.text}`;
            if(index === 1) btn.className = 'secondary';
            btn.onclick = () => {
                stats.mood += choice.mood;
                stats.energy += choice.energy;
                currentScene = choice.next;
                updateGame();
            };
            choicesBox.appendChild(btn);
        });
    }

    // تشغيل اللعبة لأول مرة
    updateGame();
</script>

</body>
</html>
