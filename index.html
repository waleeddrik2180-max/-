<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزاج اليوم - فرع 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #fcd34d;
            --primary-glow: rgba(252, 211, 77, 0.4);
            --bg-deep: #030712;
            --glass-bg: rgba(17, 24, 39, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            padding-bottom: 160px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(252, 211, 77, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
        }

        header {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(3, 7, 18, 0.98) 100%);
            backdrop-filter: blur(25px);
            padding: 45px 20px;
            text-align: center;
            border-bottom: 2px solid rgba(252, 211, 77, 0.35);
            box-shadow: 0 25px 50px rgba(0,0,0,0.85);
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        header h1 {
            font-size: 3rem;
            color: #fff;
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 30px var(--primary-glow);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.15rem;
        }

        .container {
            max-width: 1250px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .delivery-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 18px 30px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-size: 1.15rem;
        }

        .delivery-banner i {
            color: var(--primary);
            font-size: 1.4rem;
        }

        .delivery-banner strong {
            color: var(--primary);
            letter-spacing: 1.5px;
            font-weight: 900;
        }

        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 45px;
        }

        .cat-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
            padding: 14px 26px;
            border-radius: 35px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 1.05rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .cat-btn:hover, .cat-btn.active {
            background: linear-gradient(135deg, #fcd34d, #f59e0b);
            color: #030712;
            border-color: #fcd34d;
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 30px var(--primary-glow);
        }

        .section-title {
            font-size: 1.9rem;
            margin: 50px 0 25px;
            padding-right: 18px;
            border-right: 6px solid var(--primary);
            color: #fff;
            font-weight: 900;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 12px 35px rgba(0,0,0,0.5);
            position: relative;
        }

        .menu-card:hover {
            transform: translateY(-12px);
            background: rgba(30, 41, 59, 0.85);
            border-color: rgba(252, 211, 77, 0.5);
            box-shadow: 0 20px 45px rgba(252, 211, 77, 0.2);
        }

        .card-header {
            position: relative;
            background: rgba(15, 23, 42, 0.7);
            padding: 26px 18px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .price-tag {
            position: absolute;
            top: 14px;
            right: 14px;
            background: linear-gradient(135deg, #fcd34d, #f59e0b);
            color: #030712;
            font-weight: 900;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(252, 211, 77, 0.35);
        }

        .card-header h3 {
            font-size: 1.35rem;
            color: #fff;
            margin-top: 10px;
            font-weight: 800;
        }

        .card-body {
            padding: 24px 18px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .calories {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 22px;
            background: rgba(3, 7, 18, 0.6);
            display: inline-block;
            padding: 8px 18px;
            border-radius: 14px;
            align-self: center;
            border: 1px solid var(--glass-border);
        }

        .calories i {
            color: #f43f5e;
            margin-left: 6px;
        }

        .add-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.15rem;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .add-btn:hover {
            transform: scale(1.04);
        }

        .add-btn.added {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        /* شريط السلة العائم التفاعلي */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(30px);
            border-top: 2px solid rgba(252, 211, 77, 0.5);
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -20px 60px rgba(0,0,0,0.95);
            z-index: 1000;
            transition: transform 0.2s ease;
        }

        .cart-bar.pulse {
            transform: scale(1.01);
            border-top-color: #10b981;
        }

        .cart-info {
            font-size: 1.35rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-info span {
            color: var(--primary);
        }

        .view-cart-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .view-cart-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .whatsapp-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            padding: 16px 38px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 8px 30px rgba(34, 197, 94, 0.45);
        }

        .whatsapp-btn:hover {
            transform: scale(1.06);
        }

        /* نافذة السلة المنبتقة */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: #111827;
            border: 1px solid var(--glass-border);
            width: 90%;
            max-width: 500px;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            position: relative;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #fff;
            font-size: 1.4rem;
        }

        .close-modal {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 20px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--glass-border);
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item-controls button {
            background: #374151;
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 2.3rem; }
            .cart-bar { padding: 18px 20px; flex-direction: column; gap: 16px; text-align: center; }
            .cart-info { flex-direction: column; gap: 10px; }
            .whatsapp-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <h1>مزاج اليوم</h1>
        <p>فرع (2) - قائمة الطعام الأساسية والفاخرة</p>
    </header>

    <div class="container">
        <div class="delivery-banner">
            <i class="fa-solid fa-phone-volume"></i>
            <span>خدمة التوصيل السريع:</span>
            <strong>0595804974</strong>
        </div>

        <div class="categories-nav">
            <button class="cat-btn active" onclick="filterMenu('all', this)">جميع الأصناف</button>
            <button class="cat-btn" onclick="filterMenu('burger', this)">البرجر</button>
            <button class="cat-btn" onclick="filterMenu('fajita', this)">فاهيتا وكودو</button>
            <button class="cat-btn" onclick="filterMenu('tortilla', this)">التورتيلا</button>
            <button class="cat-btn" onclick="filterMenu('meals', this)">الصحون والوجبات</button>
        </div>

        <div id="menuContainer"></div>
    </div>

    <div class="cart-bar" id="cartBar">
        <div class="cart-info">
            <span>الإجمالي: <span id="totalPrice">0</span> ر.س</span>
            <button class="view-cart-btn" onclick="toggleCartModal(true)">
                <i class="fa-solid fa-cart-shopping"></i> عرض السلة (<span id="totalCount">0</span>)
            </button>
        </div>
        <button class="whatsapp-btn" onclick="sendToWhatsApp()">
            <i class="fa-brands fa-whatsapp fa-xl"></i> إرسال الطلب عبر الواتساب
        </button>
    </div>

    <div class="modal-overlay" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>تفاصيل السلة الخاصة بك</h3>
                <button class="close-modal" onclick="toggleCartModal(false)">&times;</button>
            </div>
            <div class="modal-body" id="modalCartItems">
                </div>
            <button class="whatsapp-btn" style="width: 100%; justify-content: center;" onclick="sendToWhatsApp()">
                <i class="fa-brands fa-whatsapp fa-xl"></i> إرسال الطلب للواتساب
            </button>
        </div>
    </div>

    <script>
        const menuItems = [
            { id: 1, name: "وجبة برجر زنجر", price: 17, calories: "496 سعرة", category: "burger" },
            { id: 2, name: "وجبة برجر دجاج", price: 14, calories: "561 سعرة", category: "burger" },
            { id: 3, name: "وجبة برجر لحم", price: 14, calories: "584 سعرة", category: "burger" },
            { id: 4, name: "وجبة برجر مشوي طازج", price: 22, calories: "820 سعرة", category: "burger" },
            { id: 5, name: "برجر فلفل حار أمريكانا", price: 19, calories: "691 سعرة", category: "burger" },
            { id: 6, name: "برجر دجاج دبل أمريكانا", price: 18, calories: "714 سعرة", category: "burger" },
            { id: 7, name: "وجبة برجر دجاج طازج", price: 17, calories: "459 سعرة", category: "burger" },
            { id: 8, name: "وجبة برجر لحم طازج", price: 22, calories: "426 سعرة", category: "burger" },
            { id: 9, name: "وجبة برجر مشوي سبايسي", price: 22, calories: "462 سعرة", category: "burger" },
            { id: 10, name: "برجر دجاج طازج (دبل)", price: 25, calories: "659 سعرة", category: "burger" },
            { id: 11, name: "برجر غنم طازج (دبل)", price: 31, calories: "748 سعرة", category: "burger" },
            { id: 12, name: "وجبة برجر دبل زنجر", price: 23, calories: "922 سعرة", category: "burger" },

            { id: 13, name: "فاهيتا كودو زنجر", price: 17, calories: "516 سعرة", category: "fajita" },
            { id: 14, name: "فاهيتا كودو لحم طازج", price: 22, calories: "598 سعرة", category: "fajita" },
            { id: 15, name: "فاهيتا كودو دجاج", price: 17, calories: "573 سعرة", category: "fajita" },
            { id: 16, name: "فاهيتا كودو جمبري", price: 16, calories: "612 سعرة", category: "fajita" },
            { id: 17, name: "وجبة فاهيتا كودو مسحب", price: 14, calories: "596 سعرة", category: "fajita" },

            { id: 18, name: "تورتيلا دجاج", price: 17, calories: "566 سعرة", category: "tortilla" },
            { id: 19, name: "تورتيلا جمبري", price: 16, calories: "510 سعرة", category: "tortilla" },
            { id: 20, name: "تورتيلا زنجر", price: 17, calories: "598 سعرة", category: "tortilla" },
            { id: 21, name: "وجبة مسحب تورتيلا", price: 14, calories: "624 سعرة", category: "tortilla" },

            { id: 22, name: "صحن مسحب وجبة", price: 15, calories: "912 سعرة", category: "meals" },
            { id: 23, name: "صحن جمبري وجبة", price: 20, calories: "349 سعرة", category: "meals" }
        ];

        let cart = {};
        let currentFilter = 'all';

        const categoryNames = {
            burger: "قائمة البرجر الفاخر",
            fajita: "سندويشات فاهيتا وكودو",
            tortilla: "لفائف التورتيلا المقرمشة",
            meals: "الصحون والوجبات الخاصة"
        };

        const menuContainer = document.getElementById('menuContainer');
        const totalPriceEl = document.getElementById('totalPrice');
        const totalCountEl = document.getElementById('totalCount');
        const cartBar = document.getElementById('cartBar');

        // دالة إصدار الصوت التفاعلي
        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        function triggerCartPulse() {
            cartBar.classList.add('pulse');
            setTimeout(() => cartBar.classList.remove('pulse'), 200);
        }

        function renderMenu() {
            menuContainer.innerHTML = '';
            
            let categoriesToDisplay = currentFilter === 'all' 
                ? ['burger', 'fajita', 'tortilla', 'meals'] 
                : [currentFilter];

            categoriesToDisplay.forEach(catKey => {
                let itemsInCat = menuItems.filter(i => i.category === catKey);
                if (itemsInCat.length === 0) return;

                const titleEl = document.createElement('h2');
                titleEl.className = 'section-title';
                titleEl.textContent = categoryNames[catKey];
                menuContainer.appendChild(titleEl);

                const gridEl = document.createElement('div');
                gridEl.className = 'menu-grid';

                itemsInCat.forEach(item => {
                    const qty = cart[item.id] || 0;
                    const card = document.createElement('div');
                    card.className = 'menu-card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="price-tag">${item.price} ر.س</div>
                            <h3>${item.name}</h3>
                        </div>
                        <div class="card-body">
                            <div class="calories"><i class="fa-solid fa-fire-flame-curved"></i> ${item.calories}</div>
                            <button class="add-btn ${qty > 0 ? 'added' : ''}" onclick="updateCart(${item.id}, 1)">
                                <i class="fa-solid ${qty > 0 ? 'fa-check' : 'fa-plus'}"></i> ${qty > 0 ? 'تم الإضافة (' + qty + ')' : 'إضافة للطلب'}
                            </button>
                        </div>
                    `;
                    gridEl.appendChild(card);
                });

                menuContainer.appendChild(gridEl);
            });
        }

        function filterMenu(category, btnElement) {
            currentFilter = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderMenu();
        }

        function updateCart(id, change) {
            playClickSound();
            triggerCartPulse();
            if (!cart[id]) cart[id] = 0;
            cart[id] += change;
            if (cart[id] <= 0) delete cart[id];
            renderMenu();
            updateSummary();
            updateModalCartItems();
        }

        function updateSummary() {
            let total = 0;
            let count = 0;
            for (let id in cart) {
                const item = menuItems.find(i => i.id == id);
                total += item.price * cart[id];
                count += cart[id];
            }
            totalPriceEl.textContent = total;
            totalCountEl.textContent = count;
        }

        function toggleCartModal(open) {
            const modal = document.getElementById('cartModal');
            modal.style.display = open ? 'flex' : 'none';
            if (open) updateModalCartItems();
        }

        function updateModalCartItems() {
            const modalContainer = document.getElementById('modalCartItems');
            modalContainer.innerHTML = '';
            
            let hasItems = false;
            for (let id in cart) {
                hasItems = true;
                const item = menuItems.find(i => i.id == id);
                const row = document.createElement('div');
                row.className = 'cart-item-row';
                row.innerHTML = `
                    <div>
                        <h4 style="color:#fff; font-size:1rem; margin-bottom:4px;">${item.name}</h4>
                        <span style="color:var(--primary); font-size:0.9rem;">${item.price * cart[id]} ر.س</span>
                    </div>
                    <div class="cart-item-controls">
                        <button onclick="updateCart(${id}, -1)">-</button>
                        <span style="color:#fff; font-weight:bold; min-width:20px; text-align:center;">${cart[id]}</span>
                        <button onclick="updateCart(${id}, 1)">+</button>
                    </div>
                `;
                modalContainer.appendChild(row);
            }

            if (!hasItems) {
                modalContainer.innerHTML = `<p style="color:var(--text-muted); text-align:center; padding:20px;">السلة فارغة حالياً..</p>`;
            }
        }

        function sendToWhatsApp() {
            let count = Object.values(cart).reduce((a, b) => a + b, 0);
            if (count === 0) {
                alert('الرجاء اختيار وجبة واحدة على الأقل قبل الإرسال!');
                return;
            }

            let message = "السلام عليكم، هذا طلب جديد من مزاج اليوم (فرع 2):\n\n";
            let total = 0;

            for (let id in cart) {
                const item = menuItems.find(i => i.id == id);
                let itemTotal = item.price * cart[id];
                total += itemTotal;
                message += `▪️ ${item.name} (العدد: ${cart[id]}) - ${itemTotal} ر.س\n`;
            }

            message += `\nالإجمالي الكلي: ${total} ريال سعودي`;

            const phone = "966595804974";
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        renderMenu();
    </script>
</body>
</html>
