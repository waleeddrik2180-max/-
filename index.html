<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحياة الواقعية</title>
    <style>
        body {
            background-color: #0e1117;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .room-container {
            width: 850px;
            height: 550px;
            background: #161b22;
            border: 3px solid #30363d;
            border-radius: 20px;
            display: flex;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        /* العدادات الطولية على الجوانب */
        .side-panel {
            width: 120px;
            background: #21262d;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            border-left: 2px solid #30363d;
            border-right: 2px solid #30363d;
        }
        .gauge-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .vertical-bar {
            width: 20px;
            height: 150px;
            background: #0d1117;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
            border: 1px solid #484f58;
        }
        .fill {
            width: 100%;
            background: #238636;
            transition: height 0.3s;
        }
        /* الشخصية ومنتصف الشاشة */
        .center-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            gap: 20px;
        }
        .character-avatar {
            width: 140px;
            height: 140px;
            background: #30363d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            border: 4px solid #58a6ff;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.3);
        }
        .dialogue-box {
            width: 100%;
            background: #0d1117;
            border: 2px solid #30363d;
            border-radius: 12px;
            padding: 18px;
            font-size: 18px;
            text-align: center;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c9d1d9;
        }
        /* الأزرار والأماكن (الثلاجة، الجوال، إلخ) */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }
        .action-btn {
            background: #21262d;
            color: #58a6ff;
            border: 2px solid #30363d;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .action-btn:hover {
            background: #30363d;
            border-color: #58a6ff;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="room-container">
    <!-- عداد الطاقة الطولي على اليسار -->
    <div class="side-panel">
        <div class="gauge-box">
            <span>⚡ الطاقة</span>
            <div class="vertical-bar">
                <div class="fill" id="energyFill" style="height: 80%;"></div>
            </div>
            <strong id="energyText">80%</strong>
        </div>
    </div>

    <!-- منطقة الشخصية والأحداث في المنتصف -->
    <div class="center-stage">
        <div class="character-avatar" id="avatarIcon">👨🏻‍🦱</div>
        <div class="dialogue-box" id="gameText">
            أهلاً بك يا طويل العمر. توك راجع البيت وتعبان، وش تبغى تسوي الحين؟ اختر المكان المناسب:
        </div>
        
        <div class="action-grid" id="actionGrid">
            <button class="action-btn" onclick="openFridge()">🧊 الثلاجة (أكل)</button>
            <button class="action-btn" onclick="openPhone()">📱 الجوال (تواصل)</button>
            <button class="action-btn" onclick="openTable()">☕ الطاولة (روقان)</button>
            <button class="action-btn" onclick="openCar()">🚗 المعارض (طلعة)</button>
        </div>
    </div>

    <!-- عداد المزاج الطولي على اليمين -->
    <div class="side-panel">
        <div class="gauge-box">
            <span>🧠 المزاج</span>
            <div class="vertical-bar">
                <div class="fill" id="moodFill" style="height: 70%; background: #1f6feb;"></div>
            </div>
            <strong id="moodText">70%</strong>
        </div>
    </div>
</div>

<script>
    let stats = {
        energy: 80,
        mood: 70
    };

    function updateGauges() {
        if(stats.energy > 100) stats.energy = 100;
        if(stats.energy < 0) stats.energy = 0;
        if(stats.mood > 100) stats.mood = 100;
        if(stats.mood < 0) stats.mood = 0;

        document.getElementById('energyFill').style.height = stats.energy + '%';
        document.getElementById('energyText').innerText = stats.energy + '%';
        
        document.getElementById('moodFill').style.height = stats.mood + '%';
        document.getElementById('moodText').innerText = stats.mood + '%';
    }

    function openFridge() {
        stats.energy += 15;
        stats.mood += 5;
        updateGauges();
        document.getElementById('avatarIcon').innerText = '🍔';
        document.getElementById('gameText').innerText = "فتحْت الثلاجة ولقيت أكل خفيف ولذيذ، تغديت وشحنت طاقتك شوي!";
    }

    function openPhone() {
        stats.energy -= 10;
        stats.mood += 20;
        updateGauges();
        document.getElementById('avatarIcon').innerText = '📱';
        document.getElementById('gameText').innerText = "مسكت جوالك ودقيت على خويك تسولف معه وتغير جو، تعدل مزاجك وصرت رايق.";
    }

    function openTable() {
        stats.energy -= 5;
        stats.mood += 15;
        updateGauges();
        document.getElementById('avatarIcon').innerText = '☕';
        document.getElementById('gameText').innerText = "صلحت لك قهوة مضبوطة وقعدت على الطاولة تروق وتفكر بهدوء.";
    }

    function openCar() {
        stats.energy -= 20;
        stats.mood += 25;
        updateGauges();
        document.getElementById('avatarIcon').innerText = '🚗';
        document.getElementById('gameText').innerText = "طلعت المعارض وتمشيت بالسيارة أخذت فرة وشميت هوا، الجو كان خيال!";
    }
</script>

</body>
</html>
