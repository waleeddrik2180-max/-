<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الهروب من الظلام - 3D</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; cursor: none; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui"><h1>ابحث عن المخرج في الظلام</h1><p>استخدم الماوس للتحرك والالتفات</p></div>
    <canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let player = { x: 0, y: 0, dir: 0 };
    let frame = 0;

    function draw3D() {
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // رسم منظور الممر (وهمي 3D)
        for(let i = 0; i < 20; i++) {
            let depth = 1 - (i / 20) + (frame % 10) / 100;
            let width = canvas.width * depth;
            let height = canvas.height * depth;
            ctx.strokeStyle = `rgba(255, 0, 0, ${depth})`;
            ctx.strokeRect((canvas.width - width)/2, (canvas.height - height)/2, width, height);
        }
    }

    function animate() {
        frame++;
        draw3D();
        
        // تأثير رعب بسيط: وميض أحمر
        if(Math.random() > 0.98) {
            ctx.fillStyle = "rgba(255, 0, 0, 0.3)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        requestAnimationFrame(animate);
    }

    window.addEventListener('mousemove', (e) => {
        player.dir = (e.clientX / canvas.width) * 10;
    });

    animate();
</script>
</body>
</html>
