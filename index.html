<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزاج اليوم - فرع 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #fbbf24;
            --primary-glow: rgba(251, 191, 36, 0.5);
            --bg-deep: #05070b;
            --glass-bg: rgba(18, 24, 38, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            padding-bottom: 150px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(37, 99, 235, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        header {
            background: linear-gradient(135deg, rgba(13, 17, 26, 0.95) 0%, rgba(8, 11, 18, 0.95) 100%);
            backdrop-filter: blur(20px);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 2px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-size: 2.8rem;
            color: #fff;
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 25px var(--primary-glow);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1250px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .delivery-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 18px 30px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-size: 1.15rem;
        }

        .delivery-banner i {
            color: var(--primary);
            font-size: 1.4rem;
        }

        .delivery-banner strong {
            color: var(--primary);
            letter-spacing: 1.5px;
            font-weight: 900;
        }

        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 45px;
        }

        .cat-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
            padding: 14px 26px;
            border-radius: 35px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 1.05rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .cat-btn:hover, .cat-btn.active {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
            border-color: #fbbf24;
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .section-title {
            font-size: 1.8rem;
            margin: 50px 0 25px;
            padding-right: 18px;
            border-right: 6px solid var(--primary);
            color: #fff;
            font-weight: 900;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .menu-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            position: relative;
        }

        .menu-card:hover {
            transform: translateY(-10px);
            background: rgba(24, 32, 50, 0.85);
            border-color: rgba(251, 191, 36, 0.4);
            box-shadow: 0 20px 40px rgba(251, 191, 36, 0.15);
        }

        .card-header {
            position: relative;
            background: rgba(15, 20, 32, 0.6);
            padding: 24px 18px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .price-tag {
            position: absolute;
            top: 14px;
            right: 14px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
            font-weight: 900;
            padding: 6px 15px;
            border-radius: 30px;
            font-size: 1.05rem;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
        }

        .card-header h3 {
            font-size: 1.3rem;
            color: #fff;
            margin-top: 15px;
            font-weight: 800;
        }

        .card-body {
            padding: 22px 18px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .calories {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-bottom: 20px;
            background: rgba(10, 14, 23, 0.6);
            display: inline-block;
            padding: 7px 16px;
            border-radius: 12px;
            align-self: center;
            border: 1px solid var(--glass-border);
        }

        .calories i {
            color: #f43f5e;
            margin-left: 6px;
        }

        .add-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.1rem;
            box-shadow: 0 5px 20px rgba(37, 99, 235, 0.4);
        }

        .add-btn:hover {
            transform: scale(1.03);
        }

        .add-btn.added {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 5px 20px rgba(34, 197, 94, 0.4);
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(25px);
            border-top: 2px solid rgba(251, 191, 36, 0.4);
            padding: 22px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -15px 50px rgba(0,0,0,0.9);
            z-index: 1000;
        }

        .cart-info {
            font-size: 1.3rem;
            font-weight: 800;
        }

        .cart-info span {
            color: var(--primary);
        }

        .whatsapp-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            padding: 16px 35px;
            border-radius: 18px;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
        }

        .whatsapp-btn:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            header h1 { font-size: 2.2rem; }
            .cart-bar { padding: 18px 20px; flex-direction: column; gap: 15px; text-align: center; }
            .whatsapp-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <h1>مزاج اليوم</h1>
        <p>فرع (2) - تجربة طلب تفتح النفس</p>
    </header>

    <div class="container">
        <div class="delivery-banner">
            <i class="fa-solid fa-phone-volume"></i>
            <span>خدمة التوصيل السريع:</span>
            <strong>0595804974</strong>
        </div>

        <div class="categories-nav">
            <button class="cat-btn active" onclick="filterMenu('all', this)">جميع الأصناف</button>
            <button class="cat-btn" onclick="filterMenu('burger', this)">البرجر</button>
            <button class="cat-btn" onclick="filterMenu('fajita', this)">فاهيتا وكودو</button>
            <button class="cat-btn" onclick="filterMenu('tortilla', this)">التورتيلا</button>
            <button class="cat-btn" onclick="filterMenu('meals', this)">الصحون والوجبات</button>
        </div>

        <div id="menuContainer"></div>
    </div>

    <div class="cart-bar">
        <div class="cart-info">
            الإجمالي: <span id="totalPrice">0</span> ر.س | الأصناف المختارة: <span id="totalCount">0</span>
        </div>
        <button class="whatsapp-btn" onclick="sendToWhatsApp()">
            <i class="fa-brands fa-whatsapp fa-xl"></i> إرسال الطلب عبر الواتساب
        </button>
    </div>

    <script>
        // المنيو الكامل والدقيق مطابق 100% للصورة الأصلية
        const menuItems = [
            { id: 1, name: "وجبة برجر زنجر", price: 17, calories: "496 سعرة", category: "burger" },
            { id: 2, name: "وجبة برجر دجاج", price: 14, calories: "561 سعرة", category: "burger" },
            { id: 3, name: "وجبة برجر لحم", price: 14, calories: "584 سعرة", category: "burger" },
            { id: 4, name: "وجبة برجر مشوي طازج", price: 22, calories: "820 سعرة", category: "burger" },
            { id: 5, name: "برجر فلفل حار أمريكانا", price: 19, calories: "691 سعرة", category: "burger" },
            { id: 6, name: "برجر دجاج دبل أمريكانا", price: 18, calories: "714 سعرة", category: "burger" },
            { id: 7, name: "وجبة برجر دجاج طازج", price: 17, calories: "459 سعرة", category: "burger" },
            { id: 8, name: "وجبة برجر لحم طازج", price: 22, calories: "426 سعرة", category: "burger" },
            { id: 9, name: "وجبة برجر مشوي سبايسي", price: 22, calories: "462 سعرة", category: "burger" },
            { id: 10, name: "برجر دجاج طازج (دبل)", price: 25, calories: "659 سعرة", category: "burger" },
            { id: 11, name: "برجر غنم طازج (دبل)", price: 31, calories: "748 سعرة", category: "burger" },
            { id: 12, name: "وجبة برجر دبل زنجر", price: 23, calories: "922 سعرة", category: "burger" },

            { id: 13, name: "فاهيتا كودو زنجر", price: 17, calories: "516 سعرة", category: "fajita" },
            { id: 14, name: "فاهيتا كودو لحم طازج", price: 22, calories: "598 سعرة", category: "fajita" },
            { id: 15, name: "فاهيتا كودو دجاج", price: 17, calories: "573 سعرة", category: "fajita" },
            { id: 16, name: "فاهيتا كودو جمبري", price: 16, calories: "612 سعرة", category: "fajita" },
            { id: 17, name: "وجبة فاهيتا كودو مسحب", price: 14, calories: "596 سعرة", category: "fajita" },

            { id: 18, name: "تورتيلا دجاج", price: 17, calories: "566 سعرة", category: "tortilla" },
            { id: 19, name: "تورتيلا جمبري", price: 16, calories: "510 سعرة", category: "tortilla" },
            { id: 20, name: "تورتيلا زنجر", price: 17, calories: "598 سعرة", category: "tortilla" },
            { id: 21, name: "وجبة مسحب تورتيلا", price: 14, calories: "624 سعرة", category: "tortilla" },

            { id: 22, name: "صحن مسحب وجبة", price: 15, calories: "912 سعرة", category: "meals" },
            { id: 23, name: "صحن جمبري وجبة", price: 20, calories: "349 سعرة", category: "meals" }
        ];

        let cart = {};
        let currentFilter = 'all';

        const categoryNames = {
            burger: "قائمة البرجر الفاخر",
            fajita: "سندويشات فاهيتا وكودو",
            tortilla: "لفائف التورتيلا المقرمشة",
            meals: "الصحون والوجبات الخاصة"
        };

        const menuContainer = document.getElementById('menuContainer');
        const totalPriceEl = document.getElementById('totalPrice');
        const totalCountEl = document.getElementById('totalCount');

        function renderMenu() {
            menuContainer.innerHTML = '';
            
            let categoriesToDisplay = currentFilter === 'all' 
                ? ['burger', 'fajita', 'tortilla', 'meals'] 
                : [currentFilter];

            categoriesToDisplay.forEach(catKey => {
                const itemsInCat = menuItems.filter(i => i.category === catKey);
                if (itemsInCat.length === 0) return;

                const titleEl = document.createElement('h2');
                titleEl.className = 'section-title';
                titleEl.textContent = categoryNames[catKey];
                menuContainer.appendChild(titleEl);

                const gridEl = document.createElement('div');
                gridEl.className = 'menu-grid';

                itemsInCat.forEach(item => {
                    const qty = cart[item.id] || 0;
                    const card = document.createElement('div');
                    card.className = 'menu-card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="price-tag">${item.price} ر.س</div>
                            <h3>${item.name}</h3>
                        </div>
                        <div class="card-body">
                            <div class="calories"><i class="fa-solid fa-fire"></i> ${item.calories}</div>
                            <button class="add-btn ${qty > 0 ? 'added' : ''}" onclick="updateCart(${item.id}, 1)">
                                <i class="fa-solid ${qty > 0 ? 'fa-check' : 'fa-plus'}"></i> ${qty > 0 ? 'تم الإضافة (' + qty + ')' : 'إضافة للطلب'}
                            </button>
                        </div>
                    `;
                    gridEl.appendChild(card);
                });

                menuContainer.appendChild(gridEl);
            });
        }

        function filterMenu(category, btnElement) {
            currentFilter = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderMenu();
        }

        function updateCart(id, change) {
            if (!cart[id]) cart[id] = 0;
            cart[id] += change;
            if (cart[id] <= 0) delete cart[id];
            renderMenu();
            updateSummary();
        }

        function updateSummary() {
            let total = 0;
            let count = 0;
            for (let id in cart) {
                const item = menuItems.find(i => i.id == id);
                total += item.price * cart[id];
                count += cart[id];
            }
            totalPriceEl.textContent = total;
            totalCountEl.textContent = count;
        }

        function sendToWhatsApp() {
            let count = Object.values(cart).reduce((a, b) => a + b, 0);
            if (count === 0) {
                alert('الرجاء اختيار وجبة واحدة على الأقل قبل الإرسال!');
                return;
            }

            let message = "السلام عليكم، هذا طلب جديد من مزاج اليوم (فرع 2):\n\n";
            let total = 0;

            for (let id in cart) {
                const item = menuItems.find(i => i.id == id);
                let itemTotal = item.price * cart[id];
                total += itemTotal;
                message += `▪️ ${item.name} (العدد: ${cart[id]}) - ${itemTotal} ر.س\n`;
            }

            message += `\nالإجمالي الكلي: ${total} ريال سعودي`;

            const phone = "966595804974";
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        renderMenu();
    </script>
</body>
</html>
