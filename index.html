<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزاج اليوم - فرع 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #fcd34d;
            --primary-glow: rgba(252, 211, 77, 0.4);
            --bg-deep: #030712;
            --glass-bg: rgba(17, 24, 39, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            padding-bottom: 160px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(252, 211, 77, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
        }

        header {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(3, 7, 18, 0.98) 100%);
            backdrop-filter: blur(25px);
            padding: 45px 20px;
            text-align: center;
            border-bottom: 2px solid rgba(252, 211, 77, 0.35);
            box-shadow: 0 25px 50px rgba(0,0,0,0.85);
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        header h1 {
            font-size: 3rem;
            color: #fff;
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 30px var(--primary-glow);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.15rem;
        }

        .container {
            max-width: 1250px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .delivery-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 18px 30px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-size: 1.15rem;
        }

        .delivery-banner i {
            color: var(--primary);
            font-size: 1.4rem;
        }

        .delivery-banner strong {
            color: var(--primary);
            letter-spacing: 1.5px;
            font-weight: 900;
        }

        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 45px;
        }

        .cat-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
            padding: 14px 26px;
            border-radius: 35px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 1.05rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .cat-btn:hover, .cat-btn.active {
            background: linear-gradient(135deg, #fcd34d, #f59e0b);
            color: #030712;
            border-color: #fcd34d;
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 30px var(--primary-glow);
        }

        .section-title {
            font-size: 1.9rem;
            margin: 50px 0 25px;
            padding-right: 18px;
            border-right: 6px solid var(--primary);
            color: #fff;
            font-weight: 900;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 12px 35px rgba(0,0,0,0.5);
            position: relative;
        }

        .menu-card:hover {
            transform: translateY(-12px);
            background: rgba(30, 41, 59, 0.85);
            border-color: rgba(252, 211, 77, 0.5);
            box-shadow: 0 20px 45px rgba(252, 211, 77, 0.2);
        }

        .card-image-container {
            width: 100%;
            height: 190px;
            overflow: hidden;
            position: relative;
        }

        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .menu-card:hover .card-image-container img {
            transform: scale(1.08);
        }

        .price-tag {
            position: absolute;
            top: 14px;
            right: 14px;
            background: linear-gradient(135deg, #fcd34d, #f59e0b);
            color: #030712;
            font-weight: 900;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(252, 211, 77, 0.35);
            z-index: 2;
        }

        .card-body {
            padding: 20px 18px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-body h3 {
            font-size: 1.35rem;
            color: #fff;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .calories {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 18px;
            background: rgba(3, 7, 18, 0.6);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 12px;
            align-self: center;
            border: 1px solid var(--glass-border);
        }

        .calories i {
            color: #f43f5e;
            margin-left: 6px;
        }

        .add-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.1rem;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .add-btn:hover {
            transform: scale(1.04);
        }

        .add-btn.added {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        /* شريط السلة العائم التفاعلي */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(30px);
            border-top: 2px solid rgba(252, 211, 77, 0.5);
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -20px 60px rgba(0,0,0,0.95);
            z-index: 1000;
            transition: transform 0.2s ease;
        }

        .cart-bar.pulse {
            transform: scale(1.01);
            border-top-color: #10b981;
        }

        .cart-info {
            font-size: 1.35rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-info span {
            color: var(--primary);
        }

        .view-cart-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .view-cart-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .whatsapp-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            padding: 16px 38px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 8px 30px rgba(34, 197, 94, 0.45);
        }

        .whatsapp-btn:hover {
            transform: scale(1.06);
        }

        /* نافذة السلة المنبتقة */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: #111827;
            border: 1px solid var(--glass-border);
            width: 90%;
            max-width: 500px;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            position: relative;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #fff;
            font-size: 1.4rem;
        }

        .close-modal {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 20px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--glass-border);
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item-controls button {
            background: #374151;
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 2.3rem; }
            .cart-bar { padding: 18px 20px; flex-direction: column; gap: 16px; text-align: center; }
            .cart-info { flex-direction: column; gap: 10px; }
            .whatsapp-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <h1>مزاج اليوم</h1>
        <p>فرع (2) - قائمة الطعام الأساسية والفاخرة</p>
    </header>

    <div class="container">
        <div class="delivery-banner">
            <i class="fa-solid fa-phone-volume"></i>
            <span>خدمة التوصيل السريع:</span>
            <strong>0595804974</strong>
        </div>

        <div class="categories-nav">
            <button class="cat-btn active" onclick="filterMenu('all', this)">جميع الأصناف</button>
            <button class="cat-btn" onclick="filterMenu('burger', this)">البرجر</button>
            <button class="cat-btn" onclick="filterMenu('fajita', this)">فاهيتا وكودو</button>
            <button class="cat-btn" onclick="filterMenu('tortilla', this)">التورتيلا</button>
            <button class="cat-btn" onclick="filterMenu('meals', this)">الصحون والوجبات</button>
        </div>

        <div id="menuContainer"></div>
    </div>
