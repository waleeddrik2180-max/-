<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>THE NEON VOID</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; pointer-events: none; font-size: 24px; text-shadow: 0 0 10px #fff; }
        #start { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 50px; background: transparent; border: 2px solid #fff; color: #fff; cursor: pointer; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; }
        #start:hover { background: #fff; color: #000; }
    </style>
</head>
<body>
    <div id="ui">SCORE: 0</div>
    <button id="start">INITIATE</button>
    <canvas id="c"></canvas>

    <script>
        const c = document.getElementById('c'), ctx = c.getContext('2d'), ui = document.getElementById('ui'), btn = document.getElementById('start');
        c.width = window.innerWidth; c.height = window.innerHeight;
        let s = 0, g = false, p = {x: c.width/2, y: c.height-100, v: 0}, o = [];
        window.onmousemove = e => p.x = e.clientX;
        window.ontouchmove = e => p.x = e.touches[0].clientX;
        btn.onclick = () => { s = 0; o = []; g = true; btn.style.display = 'none'; loop(); };
        function loop() {
            if (!g) return;
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(0,0,c.width,c.height);
            if (Math.random() < 0.1) o.push({x: Math.random()*c.width, y: -20, s: 2+s/500, c: `hsl(${Math.random()*360},100%,50%)`});
            ctx.fillStyle = '#fff'; ctx.fillRect(p.x-25, p.y-25, 50, 50);
            o.forEach((e, i) => {
                e.y += e.s;
                ctx.fillStyle = e.c; ctx.fillRect(e.x, e.y, 30, 30);
                if (Math.abs(e.x - p.x) < 40 && Math.abs(e.y - p.y) < 40) { g = false; btn.innerText = 'RETRY'; btn.style.display = 'block'; }
                if (e.y > c.height) { o.splice(i, 1); s += 10; ui.innerText = 'SCORE: ' + s; }
            });
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
