<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الحياة الواقعية - مطحس</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-wrapper {
            width: 900px;
            height: 600px;
            background: #111827;
            border: 3px solid #1f2937;
            border-radius: 16px;
            display: flex;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }
        /* عدادات المزاج والطاقة الطولية على الجوانب */
        .gauge-sidebar {
            width: 110px;
            background: #1f2937;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .vertical-track {
            width: 18px;
            height: 180px;
            background: #0b0f19;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
            border: 1px solid #374151;
        }
        .fill-bar {
            width: 100%;
            background: #10b981;
            transition: height 0.2s;
        }
        /* الشاشة الرئيسية (العرض في النص + القوائم الجانبية) */
        .main-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            justify-content: space-between;
        }
        .screen-box {
            flex: 1;
            background: #0b0f19;
            border: 2px solid #1f2937;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            text-align: center;
        }
        /* محتوى العرض الثابت (صور / نصوص واضحة) */
        .visual-content {
            font-size: 70px;
            margin-bottom: 10px;
        }
        .visual-title {
            font-size: 20px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 5px;
        }
        .visual-desc {
            font-size: 15px;
            color: #9ca3af;
            max-width: 500px;
        }
        /* لوحة خيارات الجوال (تظهر فقط عند فتح الجوال) */
        .phone-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 350px;
            margin-top: 10px;
        }
        .phone-btn {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .phone-btn:hover {
            background: #2563eb;
        }
        /* الأزرار الأساسية تحت */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            height: 60px;
        }
        .ctrl-btn {
            background: #1f2937;
            color: #ffffff;
            border: 2px solid #374151;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .ctrl-btn:hover {
            background: #374151;
            border-color: #60a5fa;
            color: #60a5fa;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- طاقة الجسم (يسار) -->
    <div class="gauge-sidebar">
        <span style="font-size: 13px;">⚡ الطاقة</span>
        <div class="vertical-track">
            <div class="fill-bar" id="energyFill" style="height: 85%;"></div>
        </div>
        <strong id="energyNum" style="font-size: 14px;">85%</strong>
    </div>

    <!-- الشاشة المركزية -->
    <div class="main-display">
        <div class="screen-box" id="screenBox">
            <!-- العرض الافتراضي: الرجال جالس على الكنبة -->
            <div id="defaultView">
                <div class="visual-content">🛋️👨🏻</div>
                <div class="visual-title">الجلسة في الصالة</div>
                <div class="visual-desc">الرجل جالس مرتاح على الكنبة. اختر أحد الأماكن أو الأدوات من الأسفل للتفاعل.</div>
            </div>

            <!-- لوحة الجوال وقائمة الخيارات -->
            <div id="phoneView" style="display: none; width: 100%;">
                <div class="visual-content" style="font-size: 50px;">📱</div>
                <div class="visual-title" id="phoneTitle">شاشة الجوال</div>
                <div class="visual-desc" id="phoneDesc" style="margin-bottom: 15px;">اختر التطبيق المطلوب من القائمة:</div>
                <div class="phone-menu" id="phoneMenu" style="display: flex;">
                    <button class="phone-btn" onclick="openBank()">🏦 البنك (رصيد الحساب)</button>
                    <button class="phone-btn" onclick="openMessages()">💬 الرسائل</button>
                    <button class="phone-btn" onclick="closePhoneView()">⬅️ الرجوع للوضع العادي</button>
                </div>
            </div>
        </div>

        <!-- الأزرار الرئيسية -->
        <div class="controls-grid">
            <button class="ctrl-btn" onclick="showSofa()">🛋️ الكنبة</button>
            <button class="ctrl-btn" onclick="showPhoneHome()">📱 الجوال</button>
            <button class="ctrl-btn" onclick="showFridge()">🧊 الثلاجة</button>
            <button class="ctrl-btn" onclick="showCars()">🚗 المعارض</button>
        </div>
    </div>

    <!-- المزاج العام (يمين) -->
    <div class="gauge-sidebar">
        <span style="font-size: 13px;">🧠 المزاج</span>
        <div class="vertical-track">
            <div class="fill-bar" id="moodFill" style="height: 75%; background: #3b82f6;"></div>
        </div>
        <strong id="moodNum" style="font-size: 14px;">75%</strong>
    </div>
</div>

<script>
    let state = {
        energy: 85,
        mood: 75,
        balance: 4250 // الفلوس بالريال
    };

    function updateUI() {
        document.getElementById('energyFill').style.height = state.energy + '%';
        document.getElementById('energyNum').innerText = state.energy + '%';
        document.getElementById('moodFill').style.height = state.mood + '%';
        document.getElementById('moodNum').innerText = state.mood + '%';
    }

    function resetScreen() {
        document.getElementById('defaultView').style.display = 'block';
        document.getElementById('phoneView').style.display = 'none';
    }

    // 1. الكنبة / القهوة
    function showSofa() {
        resetScreen();
        state.mood += 5;
        if(state.mood > 100) state.mood = 100;
        updateUI();
        document.getElementById('defaultView').innerHTML = `
            ☕👨🏻
            <div class="visual-title">جلسة رايقة مع القهوة</div>
            <div class="visual-desc">الرجل جالس على الكنبة وماسك كوب القهوة بيده يروق بهدوء تام.</div>
        `;
    }

    // 2. الجوال والقوائم
    function showPhoneHome() {
        document.getElementById('defaultView').style.display = 'none';
        document.getElementById('phoneView').style.display = 'flex';
        document.getElementById('phoneTitle').innerText = 'شاشة الجوال';
        document.getElementById('phoneDesc').innerText = 'اختر التطبيق المطلوب:';
        document.getElementById('phoneMenu').innerHTML = `
            <button class="phone-btn" onclick="openBank()">🏦 البنك (رصيد الحساب)</button>
            <button class="phone-btn" onclick="openMessages()">💬 الرسائل</button>
            <button class="phone-btn" onclick="resetScreen(); showSofa();">⬅️ إغلاق الجوال</button>
        `;
    }

    function openBank() {
        document.getElementById('phoneTitle').innerText = 'تطبيق البنك';
        document.getElementById('phoneDesc').innerHTML = `💳 رصيدك الحالي في الحساب:<br><strong style="font-size: 22px; color: #10b981;">${state.balance} ريال</strong>`;
        document.getElementById('phoneMenu').innerHTML = `
            <button class="phone-btn" onclick="showPhoneHome()">🔙 رجوع لقائمة الجوال</button>
        `;
    }

    function openMessages() {
        document.getElementById('phoneTitle').innerText = 'الرسائل النصية';
        document.getElementById('phoneDesc').innerText = 'لا توجد رسائل جديدة، الصندوق نظيف.';
        document.getElementById('phoneMenu').innerHTML = `
            <button class="phone-btn" onclick="showPhoneHome()">🔙 رجوع لقائمة الجوال</button>
        `;
    }

    function closePhoneView() {
        resetScreen();
        showSofa();
    }

    // 3. الثلاجة (أكل متنوع)
    function showFridge() {
        resetScreen();
        state.energy += 10;
        if(state.energy > 100) state.energy = 100;
        updateUI();
        document.getElementById('defaultView').innerHTML = `
            🥗🥛🍎
            <div class="visual-title">الثلاجة المليانة</div>
            <div class="visual-desc">ثلاجة كاملة تحتوي على خيارات متنوعة وصحية: فواكه طازجة، سلطة، وخيارات خفيفة ومفيدة. أكلت وشحنت طاقتك!</div>
        `;
    }

    // 4. المعارض (سيارات)
    function showCars() {
        resetScreen();
        state.mood += 10;
        if(state.mood > 100) state.mood = 100;
        updateUI();
        document.getElementById('defaultView').innerHTML = `
            🚗🚙🚘
            <div class="visual-title">معرض السيارات</div>
            <div class="visual-desc">تتفرج على مجموعة سيارات متنوعة ومعروضة قدامك على الشاشة لتحديد سيارة الأحلام.</div>
        `;
    }
</script>

</body>
</html>
