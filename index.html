<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مغامرة الفضاء السريع</title>
    <style>
        body { margin: 0; background: #050505; color: white; overflow: hidden; font-family: 'Arial', sans-serif; }
        #gameCanvas { display: block; margin: 0 auto; background: #000; }
        .ui { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; }
        #startBtn { position: absolute; top: 70%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; cursor: pointer; background: #ff0055; border: none; color: white; font-size: 20px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="ui">
        <h1>النقاط: <span id="score">0</span></h1>
    </div>
    <button id="startBtn">ابدأ المغامرة</button>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const startBtn = document.getElementById('startBtn');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let player = { x: canvas.width/2, y: canvas.height - 100, size: 40 };
        let obstacles = [];
        let score = 0;
        let gameActive = false;

        window.addEventListener('mousemove', e => player.x = e.clientX - 20);
        window.addEventListener('touchmove', e => player.x = e.touches[0].clientX - 20);

        function drawPlayer() {
            ctx.fillStyle = '#00f2ff';
            ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.strokeStyle = 'white';
            ctx.strokeRect(player.x, player.y, player.size, player.size);
        }

        function update() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPlayer();

            if (Math.random() < 0.05) {
                obstacles.push({ x: Math.random() * canvas.width, y: -50, size: 50, speed: 5 + (score/100) });
            }

            obstacles.forEach((obs, i) => {
                obs.y += obs.speed;
                // رسم وهمي للعمق
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(obs.x, obs.y, obs.size, obs.size);
                
                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = score;
                }

                if (obs.y + obs.size > player.y && obs.x < player.x + player.size && obs.x + obs.size > player.x) {
                    gameActive = false;
                    startBtn.style.display = 'block';
                    startBtn.innerText = 'خسرت! العب مرة أخرى';
                }
            });
            requestAnimationFrame(update);
        }

        startBtn.onclick = () => {
            score = 0; obstacles = []; gameActive = true;
            startBtn.style.display = 'none';
            update();
        };
    </script>
</body>
</html>
