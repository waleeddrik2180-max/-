<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>GTA 3D Advanced Prototype</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
    #hud {
      position: absolute;
      top: 15px; right: 15px;
      color: #fff;
      background: rgba(15, 15, 25, 0.85);
      padding: 15px 20px;
      border-radius: 12px;
      direction: rtl;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
    }
    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      width: 8px; height: 8px;
      background: #ff3333;
      border: 2px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .title { font-weight: bold; color: #ffbc00; margin-bottom: 5px; font-size: 16px; }
  </style>
</head>
<body>

<div id="crosshair"></div>
<div id="hud">
  <div class="title">🎮 التحكم باللعبة</div>
  <div>مشاة: <b>WASD</b> حركة | <b>الماوس</b> إطلاق نار</div>
  <div>سيارة: <b>W/S</b> سرعة/ريوس | <b>A/D</b> توجيه | <b>Space</b> فرامل</div>
  <div>ركوب/نزول: <b>F</b></div>
  <hr style="border-color: rgba(255,255,255,0.2); margin: 8px 0;">
  <div>الحالة: <b id="mode-text" style="color: #00ffcc;">مشاة 🚶</b></div>
  <div>السرعة: <b id="speed-text">0</b> كم/س</div>
  <div>عدد المشاة (NPCs): <b style="color: #ffbc00;">20 شخصية</b></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
  // === 1. إعداد المشهد والأجواء البيئية ===
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdfe9f3); // لون سماء دافئ
  scene.fog = new THREE.FogExp2(0xdfe9f3, 0.008);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // إضاءة الشمس والظل
  const ambientLight = new THREE.AmbientLight(0xffeedd, 0.6);
  scene.add(ambientLight);

  const sun = new THREE.DirectionalLight(0xffaa55, 1.2);
  sun.position.set(80, 100, 50);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 300;
  const d = 100;
  sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
  sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
  scene.add(sun);

  // === 2. بناء المدينة والشوارع والمباني ===
  const citySize = 300;
  const floorGeo = new THREE.PlaneGeometry(citySize, citySize);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.8 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // قائمة لحفظ وحدات الاصطدام (Bounding Boxes) للمباني
  const buildingBoxes = [];

  const buildingColors = [0x34495e, 0x7f8c8d, 0x95a5a6, 0xd2b48c, 0xb0c4de];
  for (let i = 0; i < 35; i++) {
    const w = Math.random() * 12 + 10;
    const h = Math.random() * 35 + 15;
    const d = Math.random() * 12 + 10;
    
    let x = (Math.random() - 0.5) * (citySize - 60);
    let z = (Math.random() - 0.5) * (citySize - 60);
    if (Math.abs(x) < 20 && Math.abs(z) < 20) x += 40; // تفادي منطقة البداية

    const mat = new THREE.MeshStandardMaterial({
      color: buildingColors[Math.floor(Math.random() * buildingColors.length)],
      roughness: 0.5
    });
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    b.position.set(x, h / 2, z);
    b.castShadow = true;
    b.receiveShadow = true;
    scene.add(b);

    // حساب حدود المبنى لمنع الاختراق
    const box = new THREE.Box3().setFromObject(b);
    buildingBoxes.push(box);
  }

  // === 3. إنشاء شخصية اللاعب 3D ===
  function createHumanoid(shirtColor, pantsColor) {
    const group = new THREE.Group();
    // الجسم
    const torso = new THREE.Mesh(
      new THREE.BoxGeometry(0.7, 0.9, 0.4),
      new THREE.MeshStandardMaterial({ color: shirtColor })
    );
    torso.position.y = 1.05;
    torso.castShadow = true;
    group.add(torso);

    // الرأس
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0xffdbac })
    );
    head.position.y = 1.7;
    head.castShadow = true;
    group.add(head);

    // الأرجل
    const legMat = new THREE.MeshStandardMaterial({ color: pantsColor });
    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), legMat);
    legL.position.set(-0.2, 0.4, 0);
    legL.castShadow = true;
    group.add(legL);

    const legR = legL.clone();
    legR.position.x = 0.2;
    group.add(legR);

    return group;
  }

  const playerGroup = createHumanoid(0x2980b9, 0x2c3e50);
  playerGroup.position.set(0, 0, 0);
  scene.add(playerGroup);

  // === 4. تصميم سيارة واقعية 3D ===
  function createRealisticCar() {
    const car = new THREE.Group();
    
    // الهيكل الرئيسي
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xc0392b, metalness: 0.6, roughness: 0.3 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 4.8), bodyMat);
    body.position.y = 0.6;
    body.castShadow = true;
    car.add(body);

    // السقف والزجاج
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.65, 2.4), glassMat);
    cabin.position.set(0, 1.25, -0.2);
    cabin.castShadow = true;
    car.add(cabin);

    // العجلات
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
    const wheelPositions = [
      [-1.25, 0.4, 1.5], [1.25, 0.4, 1.5],
      [-1.25, 0.4, -1.5], [1.25, 0.4, -1.5]
    ];
    wheelPositions.forEach(pos => {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI / 2;
      w.position.set(...pos);
      w.castShadow = true;
      car.add(w);
    });

    // المصابيح الأمامية
    const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
    const lightL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), lightMat);
    lightL.position.set(-0.8, 0.7, -2.41);
    const lightR = lightL.clone();
    lightR.position.x = 0.8;
    car.add(lightL); car.add(lightR);

    return car;
  }

  const carGroup = createRealisticCar();
  carGroup.position.set(8, 0, 8);
  scene.add(carGroup);

  // === 5. إنشاء 20 شخصية NPC غير متشابهة ===
  const npcs = [];
  const shirtColors = [0xe74c3c, 0x8e44ad, 0x2ecc71, 0xf1c40f, 0xe67e22, 0x1abc9c, 0x34495e];
  const pantsColors = [0x34495e, 0x2c3e50, 0x7f8c8d, 0x111111];

  for (let i = 0; i < 20; i++) {
    const sColor = shirtColors[i % shirtColors.length];
    const pColor = pantsColors[i % pantsColors.length];
    const npc = createHumanoid(sColor, pColor);
    
    // تنويع الأحجام والأطوال
    const scale = 0.85 + Math.random() * 0.3;
    npc.scale.set(scale, scale, scale);

    const x = (Math.random() - 0.5) * (citySize - 40);
    const z = (Math.random() - 0.5) * (citySize - 40);
    npc.position.set(x, 0, z);

    const dir = new THREE.Vector3((Math.random() - 0.5), 0, (Math.random() - 0.5)).normalize();
    npcs.push({ group: npc, dir: dir, speed: 0.03 + Math.random() * 0.03, changeTimer: 0 });
    scene.add(npc);
  }

  // === 6. نظام الأسلحة والطلقات ===
  const bullets = [];
  function shootBullet() {
    const b = new THREE.Mesh(
      new THREE.SphereGeometry(0.15),
      new THREE.MeshBasicMaterial({ color: 0xffcc00 })
    );
    b.position.copy(playerGroup.position);
    b.position.y += 1.4;

    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
    bullets.push({ mesh: b, dir: dir, life: 80 });
    scene.add(b);
  }

  // === 7. التحقق من الاصطدام بالمباني ===
  function checkCollision(newPos, radius = 0.8) {
    const playerSphere = new THREE.Sphere(newPos, radius);
    for (let box of buildingBoxes) {
      if (box.intersectsSphere(playerSphere)) {
        return true; // تصادم!
      }
    }
    return false;
  }

  // === 8. التحكم والمدخلات ===
  const keys = {};
  let inCar = false;
  let carSpeed = 0;

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyF') {
      const dist = playerGroup.position.distanceTo(carGroup.position);
      if (!inCar && dist < 5) {
        inCar = true;
        playerGroup.visible = false;
        document.getElementById('mode-text').innerText = "داخل السيارة 🚗";
        document.getElementById('mode-text').style.color = "#ff4444";
        document.getElementById('crosshair').style.display = 'none';
      } else if (inCar) {
        inCar = false;
        playerGroup.visible = true;
        playerGroup.position.copy(carGroup.position).add(new THREE.Vector3(2.5, 0, 0));
        document.getElementById('mode-text').innerText = "مشاة 🚶";
        document.getElementById('mode-text').style.color = "#00ffcc";
      }
    }
  });

  window.addEventListener('keyup', e => keys[e.code] = false);
  window.addEventListener('mousedown', () => { if (!inCar) shootBullet(); });

  // === 9. الحلقة الرئيسية للعبة (Game Loop) ===
  function update() {
    // تحديث الرصاص
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.mesh.position.addScaledVector(b.dir, 1.2);
      b.life--;
      if (b.life <= 0) {
        scene.remove(b.mesh);
        bullets.splice(i, 1);
      }
    }

    // تحديث حركة المشاة NPCs
    npcs.forEach(npc => {
      npc.changeTimer++;
      if (npc.changeTimer > 150 + Math.random() * 100) {
        npc.dir.set((Math.random() - 0.5), 0, (Math.random() - 0.5)).normalize();
        npc.changeTimer = 0;
      }
      const nextPos = npc.group.position.clone().addScaledVector(npc.dir, npc.speed);
      if (!checkCollision(nextPos, 0.5) && Math.abs(nextPos.x) < citySize/2 - 5 && Math.abs(nextPos.z) < citySize/2 - 5) {
        npc.group.position.copy(nextPos);
        npc.group.rotation.y = Math.atan2(npc.dir.x, npc.dir.z);
      } else {
        npc.dir.negate();
      }
    });

    if (!inCar) {
      // حركة اللاعب المشاة
      let moveX = 0, moveZ = 0;
      if (keys['KeyW']) moveZ -= 0.16;
      if (keys['KeyS']) moveZ += 0.16;
      if (keys['KeyA']) moveX -= 0.16;
      if (keys['KeyD']) moveX += 0.16;

      if (moveX !== 0 || moveZ !== 0) {
        const angle = Math.atan2(moveX, moveZ);
        playerGroup.rotation.y = angle;

        const moveStep = new THREE.Vector3(moveX, 0, moveZ);
        const nextPlayerPos = playerGroup.position.clone().add(moveStep);

        // منع اختراق الجدران للمشاة
        if (!checkCollision(nextPlayerPos, 0.6)) {
          playerGroup.position.copy(nextPlayerPos);
        }
      }

      // كاميرا المشاة
      camera.position.set(playerGroup.position.x, playerGroup.position.y + 5, playerGroup.position.z + 9);
      camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);
      document.getElementById('speed-text').innerText = "0";
      document.getElementById('crosshair').style.display = 'block';

    } else {
      // قيادة السيارة وفيزيائيتها
      if (keys['KeyW']) carSpeed = Math.min(carSpeed + 0.015, 0.7);
      else if (keys['KeyS']) carSpeed = Math.max(carSpeed - 0.01, -0.25);
      else carSpeed *= 0.96;

      if (keys['Space']) carSpeed *= 0.85;

      if (keys['KeyA']) carGroup.rotation.y += 0.035 * (carSpeed / 0.7);
      if (keys['KeyD']) carGroup.rotation.y -= 0.035 * (carSpeed / 0.7);

      const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      const nextCarPos = carGroup.position.clone().addScaledVector(forward, carSpeed);

      // منع اختراق السيارة للجدران (الارتطام بالتوقف)
      if (!checkCollision(nextCarPos, 1.8)) {
        carGroup.position.copy(nextCarPos);
      } else {
        carSpeed = -carSpeed * 0.3; // ارتداد عند الاصطدام
      }

      // كاميرا تتبع السيارة
      const camOffset = new THREE.Vector3(0, 4.5, 11).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
      camera.position.copy(carGroup.position).add(camOffset);
      camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z);

      document.getElementById('speed-text').innerText = Math.round(Math.abs(carSpeed) * 160);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(update);
  }

  update();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
