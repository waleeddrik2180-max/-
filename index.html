<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة 3D خارقة - Mat7as Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b16;
            font-family: 'Tahoma', sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(15, 15, 30, 0.85);
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
            border: 2px solid #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            letter-spacing: 1px;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3366;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 30px;
            text-align: center;
            border: 3px solid #ff3366;
            display: none;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.6);
            z-index: 10;
        }
        #gameover button {
            margin-top: 20px;
            padding: 10px 25px;
            background: #00ff88;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            transition: 0.2s;
        }
        #gameover button:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="ui">النقاط: <span id="score">0</span> | اتهرب من العوائق الحمراء باستخدام الأسهم أو WASD!</div>
    
    <div id="gameover">
        <div>❌ صقعت في العائق وانتهت اللعبة!</div>
        <div style="font-size: 20px; margin-top: 10px; color: #fff;">نقاطك: <span id="final-score">0</span></div>
        <button onclick="restartGame()">اضغط لإعادة اللعب</button>
    </div>

    <!-- استدعاء مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // إعداد المشهد والكاميرا
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b16);
        scene.fog = new THREE.FogExp2(0x0b0b16, 0.035);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 7, 12);
        camera.lookAt(0, 0, -2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // الإضاءة الديناميكية القوية
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00ff88, 1.5);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xff00ff, 2, 50);
        pointLight.position.set(0, 5, -5);
        scene.add(pointLight);

        // أرضية اللعبة (شبكة مستقبلية)
        const planeGeometry = new THREE.PlaneGeometry(60, 200, 30, 30);
        const planeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x151525, 
            roughness: 0.4,
            wireframe: false
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // إضافة خطوط مضيئة للأرضية
        const gridHelper = new THREE.GridHelper(60, 40, 0x00ff88, 0x333355);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // بناء شخصية اللاعب (مركبة أو روبوت مجسم 3D متطور)
        const playerGroup = new THREE.Group();

        // جسم اللاعب الأساسي
        const bodyGeo = new THREE.BoxGeometry(1.2, 0.6, 2);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, metalness: 0.8, roughness: 0.2 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.5;
        body.castShadow = true;
        playerGroup.add(body);

        // قمرة القيادة (زجاج أمامي)
        const cockpitGeo = new THREE.BoxGeometry(0.8, 0.5, 1);
        const cockpitMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7, roughness: 0.1 });
        const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
        cockpit.position.set(0, 0.8, -0.2);
        playerGroup.add(cockpit);

        // محركات خلفية متوهجة
        const engineGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.8, 16);
        const engineMat = new THREE.MeshBasicMaterial({ color: 0xff00ff });
        const engine1 = new THREE.Mesh(engineGeo, engineMat);
        engine1.rotation.x = Math.PI / 2;
        engine1.position.set(0.4, 0.4, 1.1);
        playerGroup.add(engine1);

        const engine2 = engine1.clone();
        engine2.position.x = -0.4;
        playerGroup.add(engine2);

        playerGroup.position.set(0, 0, 5);
        scene.add(playerGroup);

        // متغيرات الحركة والتحكم
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        let playerSpeed = 0.25;
        let obstacles = [];
        let score = 0;
        let isGameOver = false;

        // دالة إنشاء العوائق (تجي ضد اللاعب بشكل عشوائي)
        function spawnObstacle() {
            if (isGameOver) return;

            const width = Math.random() * 2 + 1;
            const height = Math.random() * 2 + 1;
            const obsGeo = new THREE.BoxGeometry(width, height, 1.5);
            const obsMat = new THREE.MeshStandardMaterial({ color: 0xff3366, roughness: 0.3, metalness: 0.5 });
            const obstacle = new THREE.Mesh(obsGeo, obsMat);

            // أماكن عشوائية على عرض الشارع (من -12 إلى 12)
            const randomX = (Math.random() - 0.5) * 24;
            obstacle.position.set(randomX, height / 2, -60);
            obstacle.castShadow = true;

            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        // إطلاق عوائق كل فترة
        let obstacleTimer = setInterval(spawnObstacle, 900);

        // تحديث اللعبة والحركة
        function updateGame() {
            if (isGameOver) return;

            // حركة اللاعب يمين ويسار وفوق تحت بحدود الشارع
            if ((keys['a'] || keys['arrowleft']) && playerGroup.position.x > -14) {
                playerGroup.position.x -= playerSpeed;
                playerGroup.rotation.z = THREE.MathUtils.lerp(playerGroup.rotation.z, 0.3, 0.1);
            } else if ((keys['d'] || keys['arrowright']) && playerGroup.position.x < 14) {
                playerGroup.position.x += playerSpeed;
                playerGroup.rotation.z = THREE.MathUtils.lerp(playerGroup.rotation.z, -0.3, 0.1);
            } else {
                playerGroup.rotation.z = THREE.MathUtils.lerp(playerGroup.rotation.z, 0, 0.1);
            }

            // حركة للأمام والخلف
            if ((keys['w'] || keys['arrowup']) && playerGroup.position.z > -20) {
                playerGroup.position.z -= playerSpeed * 0.8;
            }
            if ((keys['s'] || keys['arrowdown']) && playerGroup.position.z < 8) {
                playerGroup.position.z += playerSpeed * 0.8;
            }

            // تحريك الأرضية عشان تعطي شعور السرعة والحركة المستمرة
            plane.position.z += 0.4;
            if (plane.position.z > 50) plane.position.z = 0;

            // تحريك العوائق نحونا
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += 0.5; // سرعة العائق

                // نظام الاصطدام (Collision Detection)
                let distance = playerGroup.position.distanceTo(obs.position);
                if (distance < 1.5) {
                    gameOver();
                }

                // إزالة العوائق اللي تعدت اللاعب وزيادة النقاط

                    scene.remove(obs);
