<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>طريق الدوام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&family=Lilita+One&display=swap">
<style>
:root{--asphalt:#1c2024;--asphalt-2:#272c31;--sign:#0b6e4f;--sign-deep:#08543c;--sign-ink:#fff;--plate:#ffc72c;--plate-ink:#1a1a14;--paper:#eef2ef;--muted:#a9b6b0;--danger:#e5484d;--danger-deep:#9c2a2e;--display:'Lalezar','IBM Plex Sans Arabic',system-ui,sans-serif;--body:'IBM Plex Sans Arabic',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang=en]{--display:'Lilita One','Lalezar','IBM Plex Sans Arabic',system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--asphalt);color:var(--sign-ink);font:500 15px/1.5 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
#app{height:100%;max-width:1000px;margin-inline:auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);background:var(--asphalt)}
.hud{padding:10px 16px 8px;display:grid;gap:8px}
.row1{display:flex;align-items:center;gap:8px}
.sign{background:var(--sign);border:2px solid var(--sign-ink);border-radius:8px;box-shadow:0 0 0 2px var(--sign);padding:2px 12px;display:flex;align-items:baseline;gap:6px}
.bal{min-width:0}.bal .lbl{font-size:12px;opacity:.85}
.bal b{font:400 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.bal .unit{font:400 18px var(--display)}
.plate{margin-inline-start:auto;background:var(--plate);color:var(--plate-ink);border-radius:6px;padding:2px 12px;font:700 20px/1.3 var(--body);font-variant-numeric:tabular-nums;border:2px solid #1a1a14;white-space:nowrap}
.plate.late{background:var(--danger);color:#fff}
.day{font-size:13px;color:var(--muted);white-space:nowrap}.day b{color:var(--sign-ink);font-size:16px}
.iconbtn{width:38px;height:38px;border-radius:8px;border:2px solid #3a4148;background:var(--asphalt-2);display:grid;place-items:center;padding:0;flex:none}
.iconbtn svg{width:18px;height:18px;fill:var(--sign-ink)}
.iconbtn.lang{width:auto;min-width:38px;padding:0 10px;font:700 14px var(--body)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
.track{display:flex;align-items:center;gap:8px;min-width:0}.track svg{width:22px;height:22px;flex:none}
.rail{position:relative;flex:1;height:8px;background:#3a4148;border-radius:4px}
.rail i{position:absolute;inset:0 auto 0 0;width:0;background:var(--plate);border-radius:4px}
.rail u{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid var(--sign);text-decoration:none}
.left{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.stam{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;color:var(--muted)}
.bar{flex:1;height:10px;background:#3a4148;border-radius:5px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;width:100%;background:#5ed38a;transition:background .2s}
.stam.tired .bar i{background:var(--danger)}
.stam em{font-style:normal;color:var(--sign-ink);white-space:nowrap}
.hearts{color:var(--danger);font-size:15px;letter-spacing:1px;white-space:nowrap}
.hearts[hidden]{display:none}
#stage{position:relative;min-height:0;background:#7eb6d6;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sheet{position:absolute;inset:0;overflow-y:auto;padding:16px;background:var(--asphalt);display:flex;flex-direction:column;gap:16px}
.sheet[hidden]{display:none}
.sheet h2{margin:0;font:400 26px/1.2 var(--display);text-wrap:balance}
.mission{display:grid;gap:4px;color:var(--muted);font-size:14px}.mission b{color:var(--sign-ink);font-variant-numeric:tabular-nums}
.how{background:var(--asphalt-2);border:2px dashed var(--plate);border-radius:10px;padding:12px 14px;display:grid;gap:4px;font-size:14px}.how b{color:var(--plate)}
.special,.daily{background:linear-gradient(135deg,#7a3a14,#a35a14);border:3px solid var(--plate);border-radius:12px;padding:12px 14px;display:grid;gap:6px;font-size:14px}
.special b,.daily b{font:400 21px/1.2 var(--display);color:var(--plate)}
.special.boss{background:linear-gradient(135deg,#3a2a6b,#5a3a9c)}
.daily{background:linear-gradient(135deg,#0b6e4f,#128a63)}
.merchant{display:flex;gap:12px;align-items:center}.merchant svg{width:64px;height:64px;flex:none}
.say{background:var(--paper);color:#17201b;border-radius:12px 12px 12px 2px;padding:10px 14px;font-size:14px}
.shopgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.shopgrid h3{grid-column:1/-1;margin:6px 0 0;font:400 20px var(--display);color:var(--plate)}
.item{background:var(--sign);border:3px solid var(--sign-ink);border-radius:10px;outline:2px solid var(--sign);padding:10px 12px;display:grid;gap:6px;min-width:0}
.item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item b{font:400 20px/1.2 var(--display)}
.item p{margin:0;font-size:13px;opacity:.92}
.item.car.cur{outline-color:var(--plate)}
.item .sw{height:8px;border-radius:4px;border:1px solid rgba(255,255,255,.5)}
.perk{font-size:11px;font-weight:700;background:var(--plate);color:var(--plate-ink);border-radius:99px;padding:1px 10px;white-space:nowrap}
.pips{display:flex;gap:4px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--sign-ink)}
.pips i.on{background:var(--plate);border-color:var(--plate)}
.buy{align-self:end;justify-self:start;background:var(--plate);color:var(--plate-ink);border:2px solid #1a1a14;border-radius:6px;padding:4px 14px;font:700 15px var(--body);font-variant-numeric:tabular-nums}
.buy:disabled{background:#6f7a74;color:#20262a;border-color:#20262a;cursor:not-allowed}
.buy.use{background:var(--paper)}
.buy.on{background:transparent;color:var(--sign-ink);border-color:var(--sign-ink);cursor:default}
.reset{align-self:flex-start;background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}
.routes{display:grid;gap:10px}.routes h3{margin:0;font:400 20px var(--display);color:var(--plate)}
.routegrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.route{text-align:start;display:grid;gap:6px;min-width:0;background:var(--asphalt-2);border:3px solid #3a4148;border-radius:12px;padding:12px 14px;color:var(--sign-ink)}
.route:disabled{opacity:.55;cursor:not-allowed}
.route .rt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.route .rt b{font:400 22px/1.2 var(--display)}
.route .tag{font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px;border:2px solid currentColor}
.route.safe .tag{color:#5ed38a}.route.risk .tag{color:#ff8a3d}.route.sand .tag{color:#e6c76b}.route.toll .tag{color:#6ab7ff}.route.night .tag{color:#b79cff}
.route p{margin:0;font-size:13px;color:var(--muted)}
.route ul{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px}
.route li b{font-variant-numeric:tabular-nums}
.route[aria-pressed="true"]{background:var(--sign);border-color:var(--plate);box-shadow:0 0 0 2px var(--sign)}
.route[aria-pressed="true"] p{color:#e3efe9}
.route.risk[aria-pressed="true"]{background:#7a3a14;box-shadow:0 0 0 2px #7a3a14}
.route.risk[aria-pressed="true"] p{color:#ffe8d6}
.route.sand[aria-pressed="true"]{background:#6b5524;box-shadow:0 0 0 2px #6b5524}
.route.toll[aria-pressed="true"]{background:#1d4668;box-shadow:0 0 0 2px #1d4668}
.route.night[aria-pressed="true"]{background:#2c2a5a;box-shadow:0 0 0 2px #2c2a5a}
.route.sand[aria-pressed="true"] p,.route.toll[aria-pressed="true"] p,.route.night[aria-pressed="true"] p{color:#eef2f7}
.sect{display:grid;gap:10px}.sect h3{margin:0;font:400 20px var(--display);color:var(--plate)}
.statgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--asphalt-2);border:2px solid #3a4148;border-radius:10px;padding:8px 12px;display:grid;gap:2px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font:400 22px var(--display);font-variant-numeric:tabular-nums}
.toplist{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.toplist li{background:var(--asphalt-2);border:2px solid #3a4148;border-radius:8px;padding:6px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.toplist li:first-child{border-color:var(--plate)}
.muted{margin:0;color:var(--muted);font-size:13px}
.achgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.ach{background:var(--asphalt-2);border:2px solid #3a4148;border-radius:10px;padding:8px 12px;display:grid;gap:2px;opacity:.6}
.ach.on{opacity:1;background:var(--sign);border-color:var(--plate)}
.ach .n{font:400 17px var(--display)}
.ach p{margin:0;font-size:12px;color:#d9e4de}
.endcard{margin:auto;width:min(420px,100%);background:var(--sign);border:3px solid var(--sign-ink);outline:2px solid var(--sign);border-radius:12px;padding:18px;display:grid;gap:10px}
.endcard.bad{background:#8d2a2e;outline-color:#8d2a2e}
.endcard h2{font-size:30px}
.endcard .ln{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.endcard .note{font-size:13px;opacity:.8}
.endcard .tot{border-top:2px solid rgba(255,255,255,.5);padding-top:8px;font:400 24px var(--display)}
#pause{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,24,28,.62);font:400 34px var(--display);text-align:center;padding:16px}
#pause[hidden]{display:none}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;max-width:92%;background:var(--plate);color:var(--plate-ink);border:2px solid #1a1a14;border-radius:10px;padding:6px 16px;font:700 15px var(--body);text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.35);pointer-events:none}
#toast[hidden]{display:none}
.ctl{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;justify-items:center;background:var(--asphalt)}
#go{width:min(100%,460px);height:64px;border-radius:14px;border:3px solid #1a1a14;background:var(--plate);color:var(--plate-ink);font:400 28px var(--display);touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 5px 0 #b88d00;transition:transform .05s,box-shadow .05s,background .15s}
#go:active{transform:translateY(4px);box-shadow:0 1px 0 #b88d00}
#go.idle{background:var(--sign);color:#fff;border-color:#fff;box-shadow:0 5px 0 var(--sign-deep)}
#go.idle:active{box-shadow:0 1px 0 var(--sign-deep)}
#go.run{background:var(--danger);color:#fff;border-color:#fff;box-shadow:0 5px 0 var(--danger-deep)}
#go.run:active{box-shadow:0 1px 0 var(--danger-deep)}
.keys{font-size:12px;color:var(--muted);text-align:center}
@media (hover:none){.keys{display:none}}
@media (max-width:460px){.row2{grid-template-columns:1fr;gap:6px}.bal b{font-size:24px}.row1{gap:6px}.plate{padding:2px 8px;font-size:17px}}
.hud{grid-template-columns:minmax(0,1fr)}.row1>*{min-width:0}.plate{overflow:hidden;max-width:100%}
@media (prefers-reduced-motion:reduce){#go{transition:none}}
.iconbtn[hidden]{display:none}
.day[hidden]{display:none}
.daily.wheelc{background:linear-gradient(135deg,#4a2a7c,#7a3fb0)}
.quests{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;background:var(--asphalt-2);border:2px solid #3a4148;border-radius:10px;padding:8px 12px}
.qrow.done{border-color:var(--plate)}
.qrow .qn{font-size:14px}
.qrow small{color:var(--muted);font-variant-numeric:tabular-nums}
.qrow b{color:var(--plate);font-size:20px}
.qbar{grid-column:1/-1;height:8px;background:#3a4148;border-radius:4px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--plate)}
#wheel{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:rgba(14,17,20,.9);padding:16px;overflow:auto}
#wheel[hidden]{display:none}
.wbox{width:min(360px,100%);display:grid;gap:12px;justify-items:center;text-align:center}
.wbox h2{margin:0;font:400 28px var(--display);color:var(--plate)}
.wheelwrap{position:relative;width:min(300px,76vw);aspect-ratio:1;margin-top:14px}
#wheelrot{width:100%;height:100%;transition:transform 4s cubic-bezier(.12,.7,.1,1)}
#wheelrot svg{width:100%;height:100%;display:block}
.ptr{position:absolute;top:-14px;left:50%;margin-left:-12px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:26px solid var(--plate);filter:drop-shadow(0 2px 0 #1a1a14)}
#wres{min-height:1.6em;font:400 22px var(--display)}
.wbtns{display:flex;gap:10px}
.wbtns .buy{align-self:auto;justify-self:auto;font-size:17px;padding:8px 22px}
@media (prefers-reduced-motion:reduce){#wheelrot{transition:none}}
.gorow{display:flex;gap:10px;width:min(100%,460px)}
.gorow #go{flex:1;width:auto;min-width:0}
#defbtn{flex:none;width:96px;height:64px;border-radius:14px;border:3px solid #fff;background:#2f6fe0;color:#fff;display:grid;place-items:center;align-content:center;font:400 17px/1.05 var(--display);touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 5px 0 #1d4aa8;padding:0 4px}
#defbtn svg{width:24px;height:24px;fill:#fff}
#defbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #1d4aa8}
#defbtn[hidden]{display:none}
#defbtn.alert{animation:defp .45s infinite alternate}
@keyframes defp{to{background:#e5484d;box-shadow:0 5px 0 #8d2a2e}}
@media (prefers-reduced-motion:reduce){#defbtn.alert{animation:none;background:#e5484d}}
#ending{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:rgba(14,17,20,.95);padding:16px;overflow:auto}
#ending[hidden]{display:none}
.escene{width:min(440px,100%);display:grid;gap:14px;justify-items:center;text-align:center}
.escene h2{margin:0;font:400 28px var(--display);color:var(--plate)}
.chars{display:flex;gap:28px;align-items:flex-end;justify-content:center}
.ch{display:grid;gap:4px;justify-items:center;opacity:.45;transform:scale(.9);transition:opacity .2s,transform .2s;font-size:13px}
.ch.on{opacity:1;transform:scale(1.08)}
.ch svg{width:92px;height:92px;border-radius:14px;display:block}
.bubble{background:var(--paper);color:#17201b;border-radius:14px;padding:12px 16px;font-size:16px;line-height:1.6;min-height:5.4em;width:100%;display:grid;align-items:center}
.ebtns .buy{align-self:auto;justify-self:auto;font-size:17px;padding:8px 26px}
.eprog{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.admrow{display:flex;gap:8px;flex-wrap:wrap}
.escene.wide{width:min(560px,100%);grid-template-columns:minmax(0,1fr)}
#ecv{width:100%;max-width:100%;min-width:0;height:auto;display:block;border-radius:12px;border:3px solid #3a4148;background:#7ec8ee}
.escene .statgrid{width:100%}
.escene p{margin:0;color:#d9e4de}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;opacity:.9;animation:cf 3.4s linear infinite}
@keyframes cf{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.ch{transition:none}.confetti{display:none}}
</style></head><body>
<div id="app">
  <header class="hud">
    <div class="row1">
      <div class="sign bal"><span class="lbl" id="t-bal"></span><b id="bal">0</b><span class="unit" id="t-unit"></span></div>
      <div class="day"><span id="t-day"></span> <b id="day">1</b></div>
      <div class="plate" id="clock">6:00</div>
      <button class="iconbtn" id="sndbtn" type="button"></button>
      <button class="iconbtn lang" id="langbtn" type="button"></button>
      <button class="iconbtn" id="homebtn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 12 4l9 8v8h-6v-5H9v5H3z"/></svg></button>
      <button class="iconbtn" id="pausebtn"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg></button>
    </div>
    <div class="row2">
      <div class="track" dir="ltr">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 12 4l9 8v8h-6v-5H9v5H3z" fill="#ffffff"/></svg>
        <div class="rail"><i id="prog"></i><u id="dot"></u></div>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1" fill="#7fb2e5"/><g fill="#14304d"><rect x="8" y="6" width="3" height="3"/><rect x="13" y="6" width="3" height="3"/><rect x="8" y="11" width="3" height="3"/><rect x="13" y="11" width="3" height="3"/><rect x="10.5" y="16" width="3" height="5"/></g></svg>
        <span class="left" id="left">500</span>
      </div>
      <div class="stam" id="stamwrap"><span id="t-fuel"></span><div class="bar"><i id="stam"></i></div><em id="vehname"></em><span class="hearts" id="hearts" hidden></span></div>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <section class="sheet" id="home"></section>
    <section class="sheet" id="end" hidden></section>
    <div id="toast" hidden></div>
    <div id="pause" hidden></div>
    <div id="wheel" hidden></div>
    <div id="ending" hidden></div>
  </main>
  <footer class="ctl">
    <div class="gorow"><button id="go" type="button"></button><button id="defbtn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l8-5v16l-8-5H3z"/><path d="M18 8q3 4 0 8" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round"/></svg><span id="deft"></span></button></div>
    <div class="keys" id="keys"></div>
  </footer>
</div>
<script>

  var TX = {

      homeAria: 'الرئيسية', homeToast: 'رجعت للبيت. الرحلة انلغت.',
