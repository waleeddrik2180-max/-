<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديات العرسان - لعبة القرارات</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #e94560;
            font-family: Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            width: 700px;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .stats-row {
            display: flex;
            justify-content: space-around;
            background: #0f3460;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            color: #fff;
        }
        .main-screen {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 10px;
            min-height: 100px;
            font-size: 18px;
            color: #fff;
            line-height: 1.6;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #0f3460;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .choice-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            text-align: right;
            transition: 0.2s;
        }
        .choice-btn:hover {
            background: #ff6b81;
        }
    </style>
</head>
<body>

<div class="box">
    <div class="stats-row">
        <span>✨ التوازن الأسري: <strong id="balance">75</strong>%</span>
        <span>⚡ طاقة اليوم: <strong id="energy">85</strong>%</span>
    </div>
    
    <div class="main-screen" id="textField">
        جاري بدء القصة...
    </div>
    
    <div class="btn-group" id="buttonsField"></div>
</div>

<script>
    let player = {
        balance: 75,
        energy: 85
    };

    const storyChapters = [
        {
            text: "الساعة 11 بالليل، والبيت هادئ فجأة انقطع الواي فاي والمدام تسأل عن سبب المشكلة وأنت جوالك فاصل نت بعد.",
            choices: [
                { text: "تقوم فوراً وتشوف المودم وتحاول تصلحه عشان تروق الأجواء.", balance: +15, energy: -15, next: 1 },
                { text: "تقول لها بكرة نتفاهم وتطنش وتكمل جلستك.", balance: -20, energy: +10, next: 2 }
            ]
        },
        {
            text: "طلعت البلكونة تشم هوا والجو خيال، وجتك فكرة تطلب عشاء خفيف وتجلسون تسولفون بعيد عن جو الجوالات.",
            choices: [
                { text: "تطلب عشاء سريع وتفاجئها بسهرة هادية.", balance: +20, energy: -10, next: 2 },
                { text: "تكنسل الفكرة وتدخل تنام من التعب.", balance: -10, energy: +20, next: 0 }
            ]
        },
        {
            text: "بداية يوم جديد والنشاط قليل، وراك مشاوير كثيرة لازم تخلصها قبل الظهر.",
            choices: [
                { text: "تشرب قهوة ثقيلة وتشد حيلك تخلص كل شي.", balance: +10, energy: -25, next: 0 },
                { text: "تأجل بعض المشاوير وتريح بالبيت شوي.", balance: -5, energy: +15, next: 1 }
            ]
        }
    ];

    let currentStep = 0;

    function renderGame() {
        if (player.balance > 100) player.balance = 100;
        if (player.balance < 0) player.balance = 0;
        if (player.energy > 100) player.energy = 100;
        if (player.energy < 0) player.energy = 0;

        document.getElementById('balance').innerText = player.balance;
        document.getElementById('energy').innerText = player.energy;

        const chapter = storyChapters[currentStep];
        document.getElementById('textField').innerText = chapter.text;

        const btnContainer = document.getElementById('buttonsField');
        btnContainer.innerHTML = '';

        chapter.choices.forEach((opt) => {
            const b = document.createElement('button');
            b.className = 'choice-btn';
            b.innerText = `▫️ ${opt.text}`;
            b.onclick = () => {
                player.balance += opt.balance;
                player.energy += opt.energy;
                currentStep = opt.next;
                renderGame();
            };
            btnContainer.appendChild(b);
        });
    }

    renderGame();
</script>

</body>
</html>
