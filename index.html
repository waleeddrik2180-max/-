<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يوميات واقعية - لعبة القرارات</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #d1d5db;
            font-family: Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .game-wrapper {
            width: 780px;
            background: #111827;
            border: 2px solid #1f2937;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .status-panel {
            display: flex;
            justify-content: space-around;
            background: #1f2937;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
        }
        .narrative-box {
            background: #0b0f19;
            padding: 25px;
            border-radius: 12px;
            min-height: 120px;
            font-size: 18px;
            color: #f3f4f6;
            line-height: 1.7;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #374151;
        }
        .options-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .choice-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            text-align: right;
            transition: 0.2s;
        }
        .choice-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="status-panel">
        <span>⚡ المزاج: <strong id="mood">80</strong>%</span>
        <span>🔋 الطاقة: <strong id="energy">90</strong>%</span>
        <span>💰 الحالة المادية: <strong id="cash">150</strong> ريال</span>
    </div>
    
    <div class="narrative-box" id="storyArea">
        جاري تحميل تفاصيل اليوم...
    </div>
    
    <div class="options-box" id="optionsArea"></div>
</div>

<script>
    let playerState = {
        mood: 80,
        energy: 90,
        cash: 150
    };

    // القصة الموسعة والواقعية بقرارات متعددة
    const storyNodes = {
        start: {
            text: "توه طالع من الدوام وراسك يلف من التعب، داق عليك صديقك يقول 'جالس بالشباب في الكافية تعال نغير جو'، وش بتسوي؟",
            options: [
                { text: "أروح معهم وأغير جو وأطلب قهوة مضبطة.", mood: +20, energy: -15, cash: -30, next: "cafe_night" },
                { text: "أعتذر منهم وأرجع البيت أبغى أريح.", mood: -10, energy: +10, cash: 0, next: "go_home" }
            ]
        },
        cafe_night: {
            text: "قعدت مع الشباب وسولفتوا لين متأخر، الجو كان حلو وفصلت عن هموم اليوم تماماً، بس رجعت البيت متأخر والظهر منتهي.",
            options: [
                { text: "أدخل أنام فوراً عشان ألحق أصحى بدري بكرة.", mood: +10, energy: +30, cash: 0, next: "morning_routine" },
                { text: "أقعد أطالع جوالي وألعب شوي لين الفجر.", mood: -15, energy: -20, cash: 0, next: "late_gaming" }
            ]
        },
        go_home: {
            text: "وصلت البيت بدري، البيت هادئ وتقدر تاخذ راحتك بالجلسة لحالك بدون إزعاج.",
            options: [
                { text: "أطلب عشاء خفيف وأقعد أخطط لمشاوير بكرة.", mood: +15, energy: -5, cash: -40, next: "morning_routine" },
                { text: "أفتح اللعبة وأفصل عن العالم.", mood: +20, energy: -15, cash: 0, next: "late_gaming" }
            ]
        },
        morning_routine: {
            text: "بدأ يوم جديد، الشمس طالعة وعندك كذا مشوار لازم تخلصه بس تحس إنك رايق وجاهز.",
            options: [
                { text: "أطلع أتمشى بالسيارة أشم هوا وأخلص مشاويري بهدوء.", mood: +25, energy: -20, cash: -20, next: "start" },
                { text: "أجلس بالبيت أصلح قهوتي وأروق على راقي.", mood: +15, energy: -10, cash: -15, next: "start" }
            ]
        },
        late_gaming: {
            text: "سهرت لقت متأخر وصحيت اليوم الثاني والعين مبوشة والراس ثقيل من السهر.",
            options: [
                { text: "آخذ قهوة ثقيلة وأحاول أعدل يومي بالغصب.", mood: -10, energy: -10, cash: -20, next: "start" },
                { text: "أسحب على كل شي وأرجع أنام.", mood: -20, energy: +40, cash: 0, next: "start" }
            ]
        }
    };

    function renderStage(nodeKey) {
        const node = storyNodes[nodeKey];
        
        // ضبط الحدود عشان ما تتخطى 100 أو تنزل تحت الصفر
        playerState.mood = Math.max(0, Math.min(100, playerState.mood));
        playerState.energy = Math.max(0, Math.min(100, playerState.energy));

        document.getElementById('mood').innerText = playerState.mood;
        document.getElementById('energy').innerText = playerState.energy;
        document.getElementById('cash').innerText = playerState.cash;

        document.getElementById('storyArea').innerText = node.text;

        const optionsContainer = document.getElementById('optionsArea');
        optionsContainer.innerHTML = '';

        node.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = `▫️ ${opt.text}`;
            btn.onclick = () => {
                playerState.mood += opt.mood;
                playerState.energy += opt.energy;
                playerState.cash += opt.cash;
                renderStage(opt.next);
            };
            optionsContainer.appendChild(btn);
        });
    }

    // تشغيل اللعبة من البداية
    renderStage('start');
</script>

</body>
</html>
