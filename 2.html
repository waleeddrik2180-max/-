<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هاتريك - Hattrick</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --accent-color: #00e676;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(180deg, #161b22 0%, #0b0e14 100%);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 24px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .leagues-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            background: #12161c;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .league-chip {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .league-chip.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-color: var(--accent-color);
        }

        .section {
            display: none;
            padding: 16px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }

        .badge-live {
            background: #ff1744;
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .teams-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 35%;
        }

        .team-icon {
            width: 44px;
            height: 44px;
            background: #21262d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .team-name {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }

        .score-box {
            background: #21262d;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            letter-spacing: 2px;
        }

        .goal-alert {
            background: rgba(0, 230, 118, 0.15);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            text-align: center;
            padding: 6px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            display: none;
        }

        .predict-section {
            margin-top: 12px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .predict-inputs {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .predict-inputs input {
            width: 45px;
            height: 36px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-predict {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .profile-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--accent-color), #00b0ff);
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #000;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: #161b22;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-futbol"></i> HATTRICK</h1>
    </header>

    <div class="leagues-scroll">
        <div class="league-chip active" onclick="filterLeague('all', this)">الكل 🔥</div>
        <div class="league-chip" onclick="filterLeague('saudi', this)">دوري روشن السعودي 🇸🇦</div>
        <div class="league-chip" onclick="filterLeague('ucl', this)">أبطال أوروبا 🇪🇺</div>
        <div class="league-chip" onclick="filterLeague('eng', this)">الدوري الإنجليزي 🏴󠁧󠁢󠁥󠁮󠁧󠁿</div>
    </div>

    <div id="matches-sec" class="section active">
        <div class="match-card" data-league="saudi">
            <div class="match-header">
                <span>دوري روشن السعودي</span>
                <span class="badge-live">مباشر 82'</span>
            </div>
            <div id="alert-1" class="goal-alert">⚽ قوووول! سجل الهلال الهدف الثاني!</div>
            <div class="teams-container">
                <div class="team">
                    <div class="team-icon">🔵</div>
                    <div class="team-name">الهلال</div>
                </div>
                <div class="score-box" id="score-1">1 - 1</div>
                <div class="team">
                    <div class="team-icon">🟡</div>
                    <div class="team-name">النصر</div>
                </div>
            </div>
            <button onclick="simulateGoal(1, 'الهلال')" style="width:100%; background:#21262d; border:1px solid #30363d; color:#00e676; padding:6px; border-radius:6px; margin-bottom:10px; cursor:pointer; font-size:12px;">⚡ (تجربة مبرمج): محاكاة هدف جديد</button>
            <div class="predict-section">
                <div class="predict-inputs">
                    <input type="number" placeholder="0">
                    <span>:</span>
                    <input type="number" placeholder="0">
                    <button class="btn-predict" onclick="alert('تم حفظ توقعك!')">توقع</button>
                </div>
            </div>
        </div>
    </div>

    <div id="profile-sec" class="section">
        <div class="profile-card">
            <div class="avatar"><i class="fa-solid fa-user-ninja"></i></div>
            <h2>وليد (Mt7as)</h2>
            <div style="color:var(--accent-color); font-size:13px; margin-top:5px; font-weight:bold;">مؤسس ومبرمج تطبيق هاتريك 🚀</div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('matches-sec', this)">
            <i class="fa-solid fa-gamepad"></i>
            <span>المباريات</span>
        </div>
        <div class="nav-item" onclick="switchTab('profile-sec', this)">
            <i class="fa-solid fa-user"></i>
            <span>حسابي</span>
        </div>
    </div>

    <script>
        function switchTab(secId, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(secId).classList.add('active');
            el.classList.add('active');
        }

        function filterLeague(leagueKey, el) {
            document.querySelectorAll('.league-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');

            document.querySelectorAll('.match-card').forEach(card => {
                if(leagueKey === 'all' || card.dataset.league === leagueKey) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function simulateGoal(matchId, scoringTeam) {
            const scoreBox = document.getElementById(`score-${matchId}`);
            const alertBox = document.getElementById(`alert-${matchId}`);
            
            scoreBox.textContent = "2 - 1";
            alertBox.textContent = `⚽ قوووول لـ ${scoringTeam}! اشتعلت المباراة 🔥`;
            alertBox.style.display = 'block';

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 4000);
        }
    </script>
</body>
</html>
